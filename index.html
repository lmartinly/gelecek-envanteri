<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gelecek Envanteri</title>
<meta name="description" content="Ev kurulum ve envanter sistemi">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8EFEA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14151F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Envanter">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ————————————————————————————————————————————————
   GELECEK ENVANTERİ · design tokens (deck-derived)
   indigo #3F4DBA · blush #F8EFEA · butter #FCF1C4
   sand #EFE7DA · terra #C96A3A · sage #9BA17B
   plum #A55C7A · brown #4A3C2F
———————————————————————————————————————————————— */
:root{
  --indigo:#3F4DBA; --indigo-deep:#333F9E; --cream:#FCF1C4;
  --terra:#C96A3A; --sage:#9BA17B; --plum:#A55C7A; --brown:#4A3C2F;
  --ochre:#C09A3E;
  --bg:#F8EFEA; --surface:#FFFFFF; --sand:#EFE7DA; --sand-2:#F4EDE2;
  --ink:#3B3229; --ink-2:#8A7E70; --ink-3:#B8AC9C;
  --line:rgba(74,60,47,.10); --line-2:rgba(74,60,47,.16);
  --shadow:0 1px 2px rgba(74,60,47,.04), 0 8px 28px -14px rgba(74,60,47,.18);
  --shadow-lift:0 2px 6px rgba(74,60,47,.06), 0 18px 44px -18px rgba(74,60,47,.28);
  --gold:#C09A3E;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --serif:'Playfair Display', Georgia, serif;
  --sans:'Manrope', -apple-system, 'Segoe UI', sans-serif;
  --nav-h:64px;
  --ok:#7E9662; --warn:#C96A3A;
  --chip-indigo:rgba(63,77,186,.10); --chip-terra:rgba(201,106,58,.13);
  --chip-sage:rgba(133,150,98,.16); --chip-plum:rgba(165,92,122,.13);
  --on-indigo:#4149A8;
}
html[data-theme="dark"]{
  --bg:#14151F; --surface:#1D1E2E; --sand:#262738; --sand-2:#222334;
  --ink:#EFE8DC; --ink-2:#A79D8F; --ink-3:#6E6759;
  --line:rgba(239,232,220,.08); --line-2:rgba(239,232,220,.14);
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 28px -14px rgba(0,0,0,.5);
  --shadow-lift:0 2px 6px rgba(0,0,0,.3), 0 18px 44px -18px rgba(0,0,0,.6);
  --cream:#F6E9BF;
  --chip-indigo:rgba(133,144,236,.16); --chip-terra:rgba(224,138,94,.16);
  --chip-sage:rgba(155,161,123,.18); --chip-plum:rgba(197,126,155,.16);
  --on-indigo:#A9B2F2; --ochre:#D2AC52; --ok:#A3B786;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 var(--sans); letter-spacing:.005em;
  min-height:100dvh; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
#app{max-width:640px; margin:0 auto; padding:18px 18px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));}
h1,h2,h3{margin:0; font-weight:600}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation}
input,select,textarea{font:inherit; color:var(--ink)}
a{color:var(--on-indigo); text-decoration:none}
::placeholder{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important} }

/* — type — */
.serif{font-family:var(--serif)}
.eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-2); display:flex; align-items:center; gap:8px;
}
.eyebrow .sp{color:var(--terra); font-size:11px}
.page-title{font-family:var(--serif); font-size:30px; font-weight:500; letter-spacing:.01em; margin-top:2px}
.page-title em{font-style:italic; font-weight:500}
.section-h{display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 10px}
.section-h .eyebrow{color:var(--ink-2)}
.section-h .act{font-size:12.5px; font-weight:700; color:var(--on-indigo)}

/* — cards — */
.card{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:18px}
.card.sand{background:var(--sand); box-shadow:none}
.hr{height:1px; background:var(--line); margin:14px 0}

/* — hero countdown — */
.hero{
  position:relative; overflow:hidden; color:var(--cream);
  background:linear-gradient(155deg, #4553C4 0%, var(--indigo) 46%, #3A46A6 100%);
  border-radius:26px; padding:26px 22px 22px; box-shadow:var(--shadow-lift);
}
.hero .spark{position:absolute; color:var(--cream); opacity:.9}
.hero .eyebrow{color:var(--cream); opacity:.85; justify-content:center}
.hero-title{font-family:var(--serif); font-style:italic; font-weight:500; font-size:26px; text-align:center; margin-top:10px; line-height:1.15}
.hero-days{font-family:var(--serif); font-size:74px; font-weight:500; line-height:1; text-align:center; margin-top:10px; font-variant-numeric:lining-nums}
.hero-days small{font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.24em; display:block; margin-top:8px; opacity:.85}
.hero-date{ text-align:center; font-size:12.5px; opacity:.75; margin-top:12px}
.hero-edit{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; background:rgba(252,241,196,.14); color:var(--cream); display:grid; place-items:center}
.hero-bar{height:5px; border-radius:99px; background:rgba(252,241,196,.22); margin-top:18px; overflow:hidden}
.hero-bar i{display:block; height:100%; background:var(--cream); border-radius:99px; transition:width .8s cubic-bezier(.22,1,.36,1)}
.hero-meta{display:flex; justify-content:space-between; font-size:11.5px; font-weight:600; letter-spacing:.06em; opacity:.85; margin-top:8px}

/* — stat grid — */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.stat{background:var(--surface); border-radius:var(--r-md); box-shadow:var(--shadow); padding:15px 16px 13px}
.stat .lb{font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-2)}
.stat .v{font-family:var(--serif); font-size:26px; font-weight:500; margin-top:5px; font-variant-numeric:lining-nums; line-height:1.1}
.stat .v small{font-size:15px}
.stat .sub{font-size:11.5px; color:var(--ink-2); margin-top:3px}

/* — room cards — */
.rooms{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.room-card{
  border-radius:var(--r-lg); padding:16px 16px 14px; min-height:112px; text-align:left;
  display:flex; flex-direction:column; justify-content:space-between; position:relative;
  box-shadow:var(--shadow); transition:transform .18s ease; width:100%;
}
.room-card:active{transform:scale(.975)}
.room-card .nm{font-family:var(--serif); font-size:18.5px; font-weight:500; line-height:1.15; letter-spacing:.01em}
.room-card .pct{font-family:var(--serif); font-size:26px; font-weight:500}
.room-card .pct sup{font-size:12px; font-weight:600}
.room-card .cnt{font-size:11px; font-weight:600; letter-spacing:.05em; opacity:.75}
.room-card .bar{height:4px; border-radius:99px; background:rgba(0,0,0,.14); overflow:hidden; margin-top:8px}
.room-card .bar i{display:block; height:100%; border-radius:99px; background:currentColor; transition:width .7s cubic-bezier(.22,1,.36,1)}
.room-card.lite .bar{background:rgba(74,60,47,.12)}
.room-row-ft{display:flex; align-items:flex-end; justify-content:space-between; margin-top:12px}

/* — chips & pills — */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:99px;
  font-size:11.5px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
}
.chip.st-ihtiyac{background:var(--sand); color:var(--ink-2)}
.chip.st-arastiriliyor{background:var(--chip-indigo); color:var(--on-indigo)}
.chip.st-wishlist{background:var(--chip-plum); color:var(--plum)}
html[data-theme="dark"] .chip.st-wishlist{color:#D397B4}
.chip.st-alinacak{background:var(--chip-terra); color:var(--terra)}
html[data-theme="dark"] .chip.st-alinacak{color:#E29A70}
.chip.st-alindi{background:var(--chip-sage); color:var(--ok)}
.chip.st-evde{background:var(--chip-sage); color:var(--ok); opacity:.85}
.chip.st-hediye{background:var(--chip-plum); color:var(--plum)}
html[data-theme="dark"] .chip.st-hediye{color:#D397B4}
.chip.st-tamam{background:var(--chip-sage); color:var(--ok)}
.chip.acq-satin{background:var(--chip-sage); color:var(--ok)}
.chip.acq-hediye{background:var(--chip-plum); color:var(--plum)}
html[data-theme="dark"] .chip.acq-hediye{color:#D397B4}
.chip.acq-evde{background:var(--sand); color:var(--brown)}
html[data-theme="dark"] .chip.acq-evde{background:rgba(239,231,218,.16); color:#D8CBB6}
.brandmark{width:20px; height:20px; border-radius:6px; display:inline-block; vertical-align:-4px}
.eyebrow .brandmark{width:16px; height:16px; border-radius:5px; margin-right:7px; vertical-align:-3px}
.brandmark.dim{width:34px; height:34px; border-radius:9px; opacity:.9; display:block; margin:0 auto 8px}
.pulse{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:13px 15px; margin:6px 0 20px; box-shadow:var(--shadow)}
.pulse .brandmark{width:26px; height:26px; border-radius:8px; flex:none}
.pulse .tx{font-size:13px; color:var(--ink-2); line-height:1.45}
.pulse .tx b{color:var(--ink); font-weight:800}
.pulse .sb{color:var(--ink-3)}
.room-card .ricon{display:block; margin-bottom:10px; opacity:.95}
.room-card .ricon svg{width:24px; height:24px}
.ovgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
.mrow .mr-dot{width:7px; height:7px; border-radius:50%; flex:none; background:transparent}
.mr-dot.lo{background:var(--ok)} .mr-dot.mid{background:#C9962E} .mr-dot.hi{background:var(--terra)} .mr-dot.max{background:#B5473A}
.mrow .mr-v{width:96px; display:inline-flex; flex-direction:column; align-items:flex-end; gap:1px}
.mom{font-size:9.5px; font-weight:700; color:var(--ink-3); letter-spacing:.02em}
.sub-h{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px}
.sect.always{border:0; padding-top:0}
/* ═══ v2 bileşenleri ═══ */
.hd-row{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.hd-row .eyebrow{flex:1;margin:0}
.hd-tools{display:flex;gap:6px;flex:none}
.hd-btn,.hd-back{position:relative;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.hd-btn:active,.hd-back:active{background:var(--wash)}
.hd-btn .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--terra);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 10px}
.dm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;text-align:left;box-shadow:var(--shadow)}
.dm .lb{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.dm .v{font-size:26px;margin:3px 0 7px;color:var(--ink)}
.dm .sub{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.35}
.rc-bar{display:block;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.rc-bar i{display:block;height:100%;border-radius:3px;background:var(--pc,var(--indigo));transition:width .45s cubic-bezier(.3,.9,.3,1)}
.act-phase{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:var(--r-lg);padding:13px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.act-phase .ic{color:var(--pc);flex:none}
.act-phase .bd{flex:1;min-width:0}
.act-phase .lb{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:block}
.act-phase .t{font-size:14px;font-weight:700;color:var(--ink);display:block;margin:1px 0 7px}
.act-phase .d{font-size:11.5px;color:var(--ink-3);display:block;margin-top:6px}
.act-phase .ar{color:var(--ink-3);flex:none}
.qa-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 18px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 6px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);font-size:11px;font-weight:700;color:var(--ink-2);text-align:center}
.qa .ic{color:var(--hc)}
.road-list{display:flex;flex-direction:column;gap:11px}
.road-card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);
  border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.road-card.ghost{opacity:.78;border-left-style:dashed}
.rc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.rc-dot{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.rc-nm{font-size:15px;font-weight:700;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-act{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pc);
  border:1px solid var(--pc);border-radius:6px;padding:2px 6px;flex:none}
.rc-pct{font-size:13px;font-weight:800;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.rc-ds{font-size:12px;color:var(--ink-3);line-height:1.45;margin-bottom:9px}
.rc-meta{display:flex;gap:12px;font-size:11px;color:var(--ink-3);margin-top:8px}
.rc-meta .ok{color:var(--ok);font-weight:700}
.rc-meta .wait{color:var(--terra);font-weight:700}
.road-sum{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);
  border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.road-sum .ds{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:10px}
.ins-wrap{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.ins-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.ins-card .ic{flex:none}
.ins-card .bd{flex:1;min-width:0}
.ins-card .t{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.35}
.ins-card .d{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-card .ar{color:var(--ink-3);flex:none}
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.hub .ic{color:var(--hc);margin-bottom:4px}
.hub .t{font-size:13.5px;font-weight:700;color:var(--ink)}
.hub .d{font-size:11px;color:var(--ink-3);line-height:1.35}
.hub .n{position:absolute;top:12px;right:12px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--wash);color:var(--ink-2);font-size:11px;font-weight:800;display:grid;place-items:center}
.mvh-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.mvh-hero .lb{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mvh-hero .big{font-size:38px;color:var(--ink);margin:4px 0 10px}
.mvh-hero .sub{font-size:12px;color:var(--ink-3);margin-top:8px}
.fn-list{display:flex;flex-direction:column;gap:9px}
.fn-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.fn-card .ic{color:var(--ink-2);flex:none}
.fn-card .ic svg{width:22px;height:22px}
.fn-card .bd{flex:1;min-width:0}
.fn-card .t{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:7px}
.fn-card .d{display:block;font-size:11px;color:var(--ink-3);margin-top:6px}
.ok-dot{width:24px;height:24px;border-radius:50%;background:var(--chip-sage);color:var(--ok);display:grid;place-items:center;flex:none}
.eco-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eco-card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-top:3px solid var(--ec);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.eco-card .ic{color:var(--ec);margin-bottom:3px}
.eco-card .nm{font-size:14px;font-weight:700;color:var(--ink)}
.eco-card .ds{font-size:11px;color:var(--ink-3);line-height:1.35;margin-bottom:6px}
.eco-card .mt{font-size:11px;color:var(--ink-3);margin-top:6px}
.eco-card .rc-bar{--pc:var(--ec)}
.tl{position:relative;padding-left:4px}
.tl-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-ic{color:var(--ink-3);flex:none;margin-top:1px}
.tl-bd{flex:1;min-width:0}
.tl-bd .t{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
.tl-bd .d{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.cap-list{display:flex;flex-direction:column;gap:9px}
.cap-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px}
.cap-card .ic{color:var(--plum);flex:none}
.cap-card .bd{flex:1;min-width:0}
.cap-card .t{display:block;font-size:14.5px;color:var(--ink)}
.cap-card .d{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cap-card .ar{color:var(--ink-3);flex:none}
.box-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box-card{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;box-shadow:var(--shadow)}
.box-card .code{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.box-card .nm{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.box-card .mt{font-size:11px;color:var(--ink-3)}
.box-card .st{margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.box-card .st-paketlendi,.box-card .st-hazir{color:var(--ok)}
.box-card .st-tasindi{color:var(--on-indigo)}
.dep-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dep-row:last-of-type{border-bottom:0}
.dep-row .bd{flex:1;min-width:0}
.dep-row .nm{display:block;font-size:12.5px;color:var(--ink);line-height:1.35}
.dep-row .mt{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.dep-row.ok .nm{opacity:.6;text-decoration:line-through}
.dep-row .x{color:var(--ink-3);flex:none}

const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function fmtMoney(n, dec = 0){
  if (n == null || isNaN(n)) return '—';
  return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n) + ' ' + S.settings.currency;
}
function parseMoney(v){
  if (v == null) return null;
  let s = String(v).trim().replace(/[^\d.,\-]/g, '');
  if (!s) return null;
  if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmtDateTR(iso){
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 7 ? '-01' : '') + 'T00:00:00');
  if (isNaN(d)) return '—';
  const opts = iso.length === 7 ? { month:'long', year:'numeric' } : { day:'numeric', month:'long', year:'numeric' };
  return d.toLocaleDateString('tr-TR', opts);
}
const ymNow = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const ymIdx = ym => { if(!ym) return null; const [y,m] = ym.split('-').map(Number); return y*12 + (m-1); };
const idxYm = i => Math.floor(i/12) + '-' + String((i%12)+1).padStart(2,'0');
const ymLabel = ym => new Date(ym+'-01T00:00:00').toLocaleDateString('tr-TR',{month:'short'}).replace('.','') + ' ' + ym.slice(2,4);

/* ——— safe storage (private-mode & sandbox tolerant) ——— */
const store = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){}
  return {
    persistent: ok,
    get k(){ return ok; },
    read(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    write(k, v){ mem[k] = v; try { if (ok) localStorage.setItem(k, v); } catch(e){} },
    del(k){ delete mem[k]; try { if (ok) localStorage.removeItem(k); } catch(e){} }
  };
})();

function migrate(st){
  st = st || S;
  if (!st.tagBank) st.tagBank = [];
  if (!st.meta) st.meta = { installedAt:now(), welcomed:true, deviceId:uid() };
  if (!st.settings) st.settings = { title:'Şehre Dönüş', date:'2028-02-01', currency:'₺', theme:'system', clientId:'', updatedAt:1 };
  if (!st.settings.theme) st.settings.theme = 'system';
  st.settings.includeLow ??= false;
  /* v1 → v2: Hediye/Evde Var durumdan çıkar, edinim tipine taşınır (updatedAt'e DOKUNMA — LWW bozulur) */
  const ACQ_MAP = { alindi:'satin', hediye:'hediye', evde:'evde' };
  st.products.forEach(p => {
    p.tags ??= []; p.links ??= []; p.alts ??= [];
    if (ACQ_MAP[p.status]){ p.acq = ACQ_MAP[p.status]; p.status = 'tamam'; }
    p.acq ??= (p.status === 'tamam' ? 'satin' : null);   /* tamamlanmış her ürünün tam bir edinimi olur */
    if (p.status !== 'tamam') p.acq = null;
    if (p.prevStatus && (ACQ_MAP[p.prevStatus] || p.prevStatus === 'tamam')) p.prevStatus = 'ihtiyac';
    p.store ??= '';
    p.acqDate ??= (p.purchasedAt ? new Date(p.purchasedAt).toISOString().slice(0, 10) : null);
  });
  st.rooms.forEach(r => { if (!r.icon) r.icon = guessRoomIcon(r.name); });

  /* ─── v2 → v3 : The Blueprint ───
     Kural: hiçbir mevcut alan silinmez, hiçbir ID yeniden üretilmez, updatedAt'e dokunulmaz,
     tahmine dayalı sınıflandırma yapılmaz (faz/temel ihtiyaç/ekosistem boş başlar).
     Fonksiyon idempotenttir: ikinci kez çalıştığında hiçbir şey değişmez.                   */
  V3_COLLECTIONS.forEach(k => { if (!Array.isArray(st[k])) st[k] = []; });
  st.settings.era ??= 'planning';
  st.settings.eraChangedAt ??= null;
  st.settings.selectedListingId ??= null;
  st.settings.lastCapsuleYm ??= null;
  st.meta.schemaFrom ??= (st.v || 1);

  const ALT_MAP = { a:'eval', s:'selected', x:'rejected' };
  st.products.forEach(p => {
    p.phaseId ??= null;
    p.essential ??= false;
    p.fnIds ??= [];
    p.ecosystemIds ??= [];
    p.deps ??= [];
    p.compat ??= [];
    p.boxId ??= null;
    p.storageLoc ??= '';
    p.providedBy ??= null;
    p.research ??= { status:'none', criteria:[], notes:'', lastAt:null };
    p.warranty ??= null;
    (p.alts || []).forEach(a => {
      if (ALT_MAP[a.st]) a.st = ALT_MAP[a.st];          /* a/x/s → eval/rejected/selected */
      if (!ALT_ST.includes(a.st)) a.st = 'eval';
      a.rejectReason ??= '';
      a.crit ??= {};
      a.id ??= pid('al');
    });
  });
  st.v = SCHEMA_VERSION;
  return st;
}

/* ─── import doğrulayıcı: bozuk dosya mevcut veriyi KISMEN bile bozamaz ───
   Önce doğrula, sonra uygula. Hata listesi döner; boşsa dosya güvenli.                      */
function validateBackup(o){
  const e = [];
  if (!o || typeof o !== 'object') return ['Dosya bir JSON nesnesi değil.'];
  if (!Array.isArray(o.products)) e.push('products dizisi yok.');
  if (!Array.isArray(o.rooms)) e.push('rooms dizisi yok.');
  if (!Array.isArray(o.cats)) e.push('cats dizisi yok.');
  if (e.length) return e;
  if (o.v != null && !(o.v >= 1 && o.v <= SCHEMA_VERSION))
    e.push(`Şema sürümü ${o.v} bu uygulamadan yeni. Önce uygulamayı güncelle.`);
  const dup = (arr, k) => { const seen = new Set(), out = []; (arr||[]).forEach(x => {
    if (!x || typeof x.id !== 'string' || !x.id) out.push(`${k}: id'siz kayıt`);
    else if (seen.has(x.id)) out.push(`${k}: tekrarlanan id ${x.id}`); else seen.add(x.id); }); return out; };
  V3_COLLECTIONS.forEach(k => { if (Array.isArray(o[k])) e.push(...dup(o[k], k).slice(0, 3)); });
  const rid = new Set((o.rooms||[]).map(r => r.id)), cid = new Set((o.cats||[]).map(c => c.id));
  const pidset = new Set((o.products||[]).map(p => p.id));
  let badRef = 0, badStatus = 0, badAcq = 0;
  (o.products||[]).forEach(p => {
    if (!rid.has(p.roomId) || !cid.has(p.catId)) badRef++;
    if (p.status && !STATUSES.some(x => x.id === p.status) && !['alindi','hediye','evde'].includes(p.status)) badStatus++;
    if (p.acq && !ACQS.some(x => x.id === p.acq)) badAcq++;
  });
  if (badRef) e.push(`${badRef} üründe geçersiz oda/kategori referansı var.`);
  if (badStatus) e.push(`${badStatus} üründe tanınmayan durum değeri var.`);
  if (badAcq) e.push(`${badAcq} üründe tanınmayan edinim tipi var.`);
  (o.cats||[]).forEach(c => { if (!rid.has(c.roomId)) badRef++; });
  const orphanDeps = [];
  (o.products||[]).forEach(p => (p.deps||[]).forEach(d => {
    if (d.kind === 'product' && d.refId && !pidset.has(d.refId)) orphanDeps.push(p.id); }));
  if (orphanDeps.length) e.push(`${orphanDeps.length} bağımlılık var olmayan ürüne işaret ediyor.`);
  return e;
}

/* dangling referansları temizler (silme değil, bağı koparma) — import sonrası çağrılır */
function repairRefs(st){
  const live = k => new Set(st[k].filter(x => !x.deleted).map(x => x.id));
  const P = live('products'), PH = live('phases'), FN = live('functions'), EC = live('ecosystems'),
        BX = live('boxes'), LS = live('listings'), MS = live('measurements'), AC = new Set(st.achievements.map(a => a.defId));
  let fixed = 0;
  st.products.forEach(p => {
    p.fnIds ||= []; p.ecosystemIds ||= []; p.deps ||= []; p.compat ||= [];
    p.essential ??= false; p.phaseId ??= null; p.boxId ??= null; p.storageLoc ??= '';
    p.providedBy ??= null; p.warranty ??= null;
    p.research ||= { status:'todo', criteria:[], notes:'', lastAt:null };
    if (p.phaseId && !PH.has(p.phaseId)){ p.phaseId = null; fixed++; }
    const f0 = p.fnIds.length, e0 = p.ecosystemIds.length;
    p.fnIds = p.fnIds.filter(x => FN.has(x));
    p.ecosystemIds = p.ecosystemIds.filter(x => EC.has(x));
    fixed += (f0 - p.fnIds.length) + (e0 - p.ecosystemIds.length);
    if (p.boxId && !BX.has(p.boxId)){ p.boxId = null; fixed++; }
    if (p.providedBy && p.providedBy.kind === 'listing' && !LS.has(p.providedBy.id)){ p.providedBy = null; fixed++; }
    const d0 = p.deps.length;
    p.deps = p.deps.filter(d => d.kind === 'manual' ||
      (d.kind === 'product' && P.has(d.refId)) || (d.kind === 'measurement' && MS.has(d.refId)) ||
      (d.kind === 'listing' && LS.has(d.refId)) || (d.kind === 'milestone' && typeof d.refId === 'string'));
    fixed += d0 - p.deps.length;
    if (p.deps.some(d => d.kind === 'product' && d.refId === p.id)){      /* self-dependency */
      p.deps = p.deps.filter(d => !(d.kind === 'product' && d.refId === p.id)); fixed++;
    }
  });
  st.upgrades.forEach(u => { if (u.productId && !P.has(u.productId)) u.deleted ||= now(); });
  st.measurements.forEach(m => { if (m.listingId && !LS.has(m.listingId)) m.deleted ||= now(); });
  st.inbox.forEach(x => { x.title ??= ''; x.url ??= ''; x.note ??= ''; x.status ||= 'pending'; x.createdAt ||= now(); });
  st.giftLists.forEach(g => { g.productIds ||= []; g.shareFields = { brand:true, model:true, link:true, note:false, ...(g.shareFields || {}) };
    const n = g.productIds.length; g.productIds = g.productIds.filter(x => P.has(x)); fixed += n - g.productIds.length; });
  if (st.settings.selectedListingId && !LS.has(st.settings.selectedListingId)) st.settings.selectedListingId = null;
  return fixed;
}
function guessRoomIcon(name){
  const n = trLow(name || '');
  if (n.includes('yatak')) return 'bed';
  if (n.includes('salon') || n.includes('oturma')) return 'sofa';
  if (n.includes('mutfak')) return 'pot';
  if (n.includes('banyo')) return 'bath';
  if (n.includes('çalışma') || n.includes('ofis')) return 'desk';
  if (n.includes('bucky') || n.includes('kedi') || n.includes('pati')) return 'paw';
  if (n.includes('çocuk') || n.includes('bebek')) return 'star';
  if (n.includes('balkon') || n.includes('bahçe')) return 'plant';
  return 'home';
}

/* ——— finance ——— */
function finOf(p){
  const price = p.price ?? null;
  if (price == null || !p.instCount || !p.instStart) return { monthly:0, paid:0, remain:0, remCnt:0, active:false };
  const monthly = price / p.instCount;
  const iNow = ymIdx(ymNow()), i0 = ymIdx(p.instStart);
  const paid = clamp(iNow - i0, 0, p.instCount);   /* taksit ay SONUNDA ödenir: içinde bulunulan ay henüz ödenmedi */
  const remCnt = p.instCount - paid;
  return { monthly, paid, remCnt, remain: remCnt * monthly, active: iNow >= i0 && iNow < i0 + p.instCount };
}
function finance(){
  const i0 = ymIdx(ymNow());
  let debt = 0, month = 0, pocket = 0, pocketCnt = 0, unpriced = 0, maxLast = -1;
  let market = 0, acqVal = 0, giftVal = 0, ownedVal = 0, houseCnt = 0;
  let remainEst = 0, remainMiss = 0, wishEst = 0, wishMiss = 0;
  const cards = {}, upcoming = {};
  for (const p of prodsA()){
    if (p.status !== 'tamam'){
      /* kalan alım tahmini + wishlist tahmini */
      const est = p.listPrice ?? (p.alts.filter(a => a.st !== 'rejected' && a.price != null).map(a => a.price).sort((a,b)=>a-b)[0] ?? null);
      if (est != null) remainEst += est; else remainMiss++;
      if (p.status === 'wishlist'){ if (est != null) wishEst += est; else wishMiss++; }
      continue;
    }
    if (p.acq === 'ev'){ houseCnt++; continue; }          /* ev ile geliyor: mülkiyet değil, finansa girmez */
    const worth = p.listPrice ?? p.price;                 /* piyasa değeri: liste, yoksa ödenen */
    if (worth != null) market += worth;
    if (p.acq === 'satin'){
      pocketCnt++;
      if (p.price == null){ unpriced++; }
      else {
        pocket += p.price;
        acqVal += p.price;
        const f = finOf(p);
        if (f.monthly){
          debt += f.remain;
          if (f.remCnt > 0){
            const last = ymIdx(p.instStart) + p.instCount - 1;
            if (last > maxLast) maxLast = last;
          }
          const sIdx = ymIdx(p.instStart);
          for (let i = Math.max(sIdx, i0); i < sIdx + p.instCount; i++){
            (upcoming[i] ??= {})[p.card || 'Kart yok'] = ((upcoming[i] ??= {})[p.card || 'Kart yok'] || 0) + f.monthly;
            if (i === i0) month += f.monthly;
            cards[p.card || 'Kart yok'] = (cards[p.card || 'Kart yok'] || 0) + f.monthly;
          }
        }
      }
    } else {
      const v = p.listPrice ?? 0;                         /* hediye/evde: cebe dokunmaz, değeri liste fiyatı */
      acqVal += v;
      if (p.acq === 'hediye') giftVal += v; else ownedVal += v;
    }
  }
  const saved = Math.max(0, market - pocket);
  return {
    market, acqVal, pocket, pocketCnt, giftVal, ownedVal, houseCnt,
    saved, savedPct: market ? saved / market : null,
    debt, month, remMonths: maxLast >= i0 ? maxLast - i0 + 1 : 0,
    upcoming, cards, unpriced, remainEst, remainMiss, wishEst, wishMiss,
    lastIdx: maxLast,
  };
}

/* bir bağımlılık çözüldü mü? */
function depDone(d){
  if (!d) return true;
  if (d.kind === 'manual')      return !!d.done;
  if (d.kind === 'product'){ const t = prod(d.refId); return !!t && alive(t) && isDone(t); }
  if (d.kind === 'measurement') return !!meas(d.refId);
  if (d.kind === 'listing')     return S.settings.selectedListingId === d.refId;
  if (d.kind === 'milestone')   return (S.achievements || []).some(a => a.defId === d.refId);
  return true;
}
const openDeps  = p => (p.deps || []).filter(d => !depDone(d));
const isBlocked = p => openDeps(p).length > 0;
const isShoppable = p => !isDone(p) && !isBlocked(p);

/* ilerleme: aynı ürün hiçbir yerde iki kez sayılmaz */
function progOf(list){
  const pool = progPool(list);
  const done = pool.filter(isDone).length;
  return { done, total: pool.length, pct: pool.length ? Math.round(done / pool.length * 100) : 0 };
}
const phaseProds = id => prodsA().filter(p => p.phaseId === id);
const fnProds    = id => prodsA().filter(p => (p.fnIds || []).includes(id));
const ecoProds   = id => prodsA().filter(p => (p.ecosystemIds || []).includes(id));
const boxProds   = id => prodsA().filter(p => p.boxId === id);

/* F02 — iki tamamlanma metriği */
function readyMetric(){
  const ess = prodsA().filter(p => p.essential);
  const fns = fnsA();
  if (!ess.length) return { empty:true, done:0, total:0, pct:0, fns:[] };
  const done = ess.filter(isDone).length;
  return {
    empty:false, done, total:ess.length,
    pct: Math.round(done / ess.length * 100),
    fns: fns.map(f => { const list = fnProds(f.id); const d = list.filter(isDone).length;
      return { f, done:d, total:list.length, pct: list.length ? Math.round(d/list.length*100) : 0 }; }),
  };
}
const dreamMetric = () => progOf(prodsA());

/* F20 — milestone motoru (deterministik, tek sefer tetikler) */
function hasAch(defId, refId){ return (S.achievements || []).some(a => a.defId === defId && (refId == null || a.refId === refId)); }
function grantAch(defId, refId, atKnown){
  if (hasAch(defId, refId)) return null;
  const t = now();
  const a = { id: pid('ma'), defId, refId: refId || null, at: t, atKnown: atKnown !== false, recordedAt: t, seen: false, updatedAt: t };
  S.achievements.push(a);
  logEvent('milestone', 'milestone', defId, msDef(defId).label, {});
  return a;
}
function checkMilestones(){
  const ps = prodsA(), done = ps.filter(isDone);
  if (done.length >= 1)  grantAch('first-piece');
  if (done.length >= 50) grantAch('first-fifty');
  const dm = dreamMetric();
  if (dm.total && dm.pct >= 50) grantAch('halfway-home');
  const rm = readyMetric();
  if (!rm.empty && rm.pct >= 100) grantAch('ready-to-move');
  roomsA().forEach(r => {
    const pr = progOf(roomProds(r.id));
    if (!pr.total || pr.pct < 100) return;
    grantAch('first-room');
    if (trLow(r.name).includes('mutfak')) grantAch('kitchen-done');
    if (trLow(r.name).includes('bucky'))  grantAch('bucky-ok');
  });
  phasesA().forEach(ph => { const pr = progOf(phaseProds(ph.id)); if (pr.total && pr.pct >= 100) grantAch('phase-done', ph.id); });
  ecosA().forEach(ec => { const pr = progOf(ecoProds(ec.id)); if (pr.total && pr.pct >= 100) grantAch('eco-done', ec.id); });
}
const freshAchs = () => (S.achievements || []).filter(a => !a.seen);

/* F12 — olay kaydı (Archive / Capsule / Milestone ortak altyapısı) */
function logEvent(type, refType, refId, title, meta, at, atKnown){
  const t = now();
  const ev = { id: pid('ev'), type, refType: refType || null, refId: refId || null,
    title: title || '', meta: meta || {}, at: at === undefined ? t : at,
    atKnown: atKnown === undefined ? true : atKnown, recordedAt: t, updatedAt: t };
  (S.events ??= []).push(ev);
  return ev;
}
const eventsA = () => (S.events || []).filter(alive).sort((a,b) => (b.at || b.recordedAt) - (a.at || a.recordedAt));

function insights(){
  const out = [];
  const ps = prodsA();
  // duplicates
  const groups = {};
  ps.forEach(p => { const k = p.roomId + '|' + normName(p.name); (groups[k] ??= []).push(p); });
  const dups = Object.values(groups).filter(g => g.length > 1);
  if (dups.length) out.push({ type:'dup', t:`${dups.length} olası kopya ürün grubu`, d: dups.slice(0,3).map(g => g[0].name).join(' · '), ids: dups.flat().map(p=>p.id) });
  // high priority unpurchased
  const hi = ps.filter(p => p.priority === 'yuksek' && !isDone(p));
  if (hi.length) out.push({ type:'prio', t:`${hi.length} yüksek öncelikli ürün bekliyor`, d: hi.slice(0,3).map(p=>p.name).join(' · '), ids: hi.map(p=>p.id) });
  // expensive remaining
  const exp = ps.filter(p => !isDone(p) && (p.price ?? p.listPrice) != null)
    .sort((a,b) => (b.price ?? b.listPrice) - (a.price ?? a.listPrice)).slice(0,5);
  if (exp.length) out.push({ type:'exp', t:'En büyük bekleyen harcamalar', d: exp.slice(0,3).map(p => `${p.name} · ${fmtMoney(p.price ?? p.listPrice)}`).join('  ·  '), ids: exp.map(p=>p.id) });
  // stale wishlist
  const staleT = now() - 45*864e5;
  const stale = ps.filter(p => (p.status === 'wishlist' || p.status === 'arastiriliyor') && p.updatedAt < staleT);
  if (stale.length) out.push({ type:'stale', t:`${stale.length} wishlist ürünü 45+ gündür bekliyor`, d: stale.slice(0,3).map(p=>p.name).join(' · '), ids: stale.map(p=>p.id) });

  /* ─── v2 insight'ları: gerçek veriden, uydurma yok ─── */
  const act = phasesA().filter(x => x.active);
  if (act.length){
    const ready = ps.filter(p => act.some(a => a.id === p.phaseId) && isShoppable(p));
    if (ready.length) out.push({ type:'ready', t:`Aktif fazda ${ready.length} ürün alışverişe hazır`,
      d: ready.slice(0,3).map(p=>p.name).join(' · '), ids: ready.map(p=>p.id) });
  }
  const blocked = ps.filter(p => !isDone(p) && isBlocked(p));
  if (blocked.length) out.push({ type:'blocked', t:`${blocked.length} ürün bağımlılık nedeniyle bekliyor`,
    d: blocked.slice(0,3).map(p => `${p.name} → ${openDeps(p)[0].label || 'koşul'}`).join(' · '), ids: blocked.map(p=>p.id) });

  const rm = readyMetric();
  if (!rm.empty && rm.pct < 100){
    const miss = rm.fns.filter(x => x.total && x.pct < 100);
    if (miss.length) out.push({ type:'mvh', t:`Taşınmaya hazır olmak için ${rm.total - rm.done} temel ihtiyaç kaldı`,
      d: miss.slice(0,3).map(x => `${x.f.name} %${x.pct}`).join(' · '),
      ids: prodsA().filter(p => p.essential && !isDone(p)).map(p=>p.id) });
  }
  roomsA().forEach(r => { const pr = progOf(roomProds(r.id));
    if (pr.total >= 4 && pr.pct >= 80 && pr.pct < 100)
      out.push({ type:'near', t:`${r.name} tamamlanmaya yakın · %${pr.pct}`,
        d: `${pr.total - pr.done} ürün kaldı`, ids: roomProds(r.id).filter(p=>!isDone(p)).map(p=>p.id) }); });
  ecosA().forEach(ec => { const pr = progOf(ecoProds(ec.id));
    if (pr.total >= 3 && pr.pct >= 70 && pr.pct < 100)
      out.push({ type:'eco', t:`${ec.name} ekosistemi %${pr.pct}`,
        d: `${pr.total - pr.done} ürün kaldı`, ids: ecoProds(ec.id).filter(p=>!isDone(p)).map(p=>p.id) }); });

  const ib = inboxA();
  if (ib.length) out.push({ type:'inbox', t:`${ib.length} fikir değerlendirilmeyi bekliyor`,
    d: ib.slice(0,3).map(x => x.title || x.url).join(' · '), go:'inbox' });

  const ups = upsA().filter(u => ['fikir','arastiriliyor','alinacak'].includes(u.status));
  if (ups.length) out.push({ type:'upg', t:`${ups.length} upgrade planı açık`,
    d: ups.slice(0,3).map(u => u.targetName || prod(u.productId)?.name || '—').join(' · '), go:'upg' });

  const unboxed = ps.filter(p => isDone(p) && p.acq === 'satin' && !p.boxId && !p.storageLoc);
  if (unboxed.length >= 5 && (ERA() === 'moving' || boxesA().length))
    out.push({ type:'pack', t:`${unboxed.length} ürün hiçbir koliye atanmamış`,
      d: unboxed.slice(0,3).map(p=>p.name).join(' · '), ids: unboxed.map(p=>p.id) });

  const soon = ps.filter(p => p.warranty && p.warranty.end).map(p => {
    const d = Math.round((new Date(p.warranty.end + 'T00:00:00') - new Date()) / 864e5); return { p, d }; })
    .filter(x => x.d <= 90).sort((a,b) => a.d - b.d);
  if (soon.length) out.push({ type:'war', t: soon[0].d < 0 ? `${soon.length} üründe garanti doldu` : `${soon.length} üründe garanti bitmek üzere`,
    d: soon.slice(0,3).map(x => `${x.p.name} · ${x.d < 0 ? 'doldu' : x.d + ' gün'}`).join(' · '), go:'warr' });

  const res = ps.filter(p => p.research && p.research.lastAt && p.research.status === 'eval' && p.research.lastAt < staleT);
  if (res.length) out.push({ type:'res', t:`${res.length} araştırma uzun süredir güncellenmedi`,
    d: res.slice(0,3).map(p=>p.name).join(' · '), ids: res.map(p=>p.id) });

  /* era önceliklendirmesi */
  const W = { planning:{ready:0,mvh:1,blocked:2,prio:3,inbox:4}, moving:{pack:0,blocked:1,mvh:2,ready:3},
              living:{war:0,upg:1,eco:2,near:3} }[ERA()] || {};
  return out.sort((a,b) => (W[a.type] ?? 9) - (W[b.type] ?? 9));
}

const SETUP_PROMPT = "Yeni evim için bir eşya envanteri hazırlamanı istiyorum. Amacım \"evde olması gereken eşyaları\" sıralamak değil; taşındıktan sonra eksikliğini fark edeceğim, küçük ama hayatı ciddi kolaylaştıran ürünleri de önceden yakalamak.\n\nÖNCE BANA SOR\nŞu soruları tek tek sor, her birinde cevabımı bekle:\n1. Eve ne zaman taşınıyorum (hedef tarih)?\n2. Evde hangi odalar var? Kaç kişi yaşayacak?\n3. Sıfırdan mı kuruyorum, hangi eşyalar zaten var?\n4. Evcil hayvan, hobi, çalışma alanı, sık misafir gibi özel durumlar var mı?\n5. Neyi ilk almak istiyorum, neyi sona bırakabilirim?\nCevaplarım kısa olursa sen makul varsayımlar yap ve varsayımını bana tek cümleyle söyle.\n\nSONRA ŞU MERCEKLERDEN GEÇİR\nHer ürün için kendine sor: \"Bu kişi bunu şimdi düşünmeyebilir ama eve yerleştiğinde 'keşke önceden alsaydım' der mi?\" Cevap evetse ve ürün gerçekten işe yarıyorsa listeye gir.\n\n1) Zincir kuralı. Her ana eşya için şu zinciri kur: ana ürün, kullanım sırasında gerekenler, bakım ürünleri, temizlik, koruma, yedek, depolama, küçük acil durum ihtiyacı. Örnek: kahve makinesi yazmak yetmez; ölçek, saklama kabı, kireç çözücü, filtre, tezgah temizliği de düşünülür. Ama bunu her ürüne mekanik olarak on aksesuar eklemeye çevirme.\n2) Görünmeyen ihtiyaçlar. Ana ürünün yanında doğan yardımcı, koruyucu, düzenleyici ürünleri ara. Örnekler: çamaşır makinesi altı titreşim pedi, makine üstü raf, çamaşır filesi; lavabo süzgeci, gider açma aparatı, lavabo altı sızıntı tepsisi; yatak koruyucu, yatak altı saklama, yatak kenarı şarj çözümü; koltuk altı keçesi, mobilya kaydırıcı, tüy toplama rulosu; kavanoz açacağı, mutfak makası, silikon kapak, yağ sıçrama koruyucusu, çekmece içi düzenleyici; duş gideri saç tutucu, kapı arkası askılık; kaliteli uzatma kablosu, çoklu priz, yedek ampul, pil, kablo düzenleyici, acil durum ışığı; derz fırçası, mikrofiber bez ayrımı, süpürge filtresi; vakumlu poşet, çekmece bölücü, etiket.\n3) İlk gün krizi testi. \"Yarın taşındım, kutuların çoğu açılmadı; duş almam, tuvaleti kullanmam, yemek yemem, telefonu şarj etmem, bir şeyi temizlemem gerekiyor\" senaryosunu düşün. Genelde unutulanları özellikle yakala: tuvalet kağıdı, kağıt havlu, sabun, el havlusu, çöp poşeti, bulaşık süngeri ve deterjanı, uzatma kablosu, ampul, makas, koli bandı, maket bıçağı, tornavida, metre, el feneri, ilk yardım malzemesi, temel alet seti, su.\n4) Bir ay sonrası testi. Taşınmanın üzerinden bir ay geçti: hangi eşyanın yeri olmadığı için ortalık dağılır, hangi küçük eşya sürekli kaybolur, hangi yedek tam gerektiğinde elde olmaz, hangi yüzey çizilir veya lekelenir, hangi cihaz bakım ürünü ister, hangi kablo veya priz sorun çıkarır, hangi dolap düzenleyici ister, mevsimlik eşyalar nereye girer, misafir gelince ne eksik kalır, evcil hayvan varsa hangi küçük sorunlar çıkar? Cevapların getirdiği küçük ama yüksek faydalı ürünleri ekle.\n5) Klasik çeyiz listesini kopyalama. Modern evde gerçekten kullanılan ama geleneksel listelerde olmayan alanları da değerlendir: kablo yönetimi, modem ve elektronik aksesuar, priz çoğaltıcı, mobilya koruyucu, cihaz bakım ürünleri, dolap ve çekmece organizasyonu, evcil hayvan ekipmanı, acil durum ekipmanı, küçük tamir aletleri, taşınma sonrası kutu ve ambalaj yönetimi.\n\nSINIR\nListeyi \"aklıma gelen her şey\" çöplüğüne çevirme. Bir ürün ancak gerçekten işe yarıyorsa, Türkiye'de normal bir evde kullanılıyorsa, benim yaşam tarzıma uyuyorsa ve başka bir ürünle zaten karşılanmıyorsa girer. Tek kullanımlık, aşırı spesifik veya \"belki lazım olur\" ürünleri ekleme. Aynı ürünü iki kez yazma. Hedef en uzun liste değil; tek başıma düşünseydim atlayacağım ihtiyaçları da yakalayan, gerçekten kullanılabilir bir master liste.\n\nÇIKTI\nCevaplarımı aldıktan sonra bana SADECE aşağıdaki formatta JSON ver. Giriş cümlesi, açıklama, yorum yazma; yalnızca kod bloğu içinde JSON olsun:\n\n{\n  \"hedef\": { \"baslik\": \"Yeni Ev\", \"tarih\": \"2027-06-01\" },\n  \"odalar\": [\n    {\n      \"ad\": \"Mutfak\",\n      \"ikon\": \"pot\",\n      \"renk\": \"#C96A3A\",\n      \"kategoriler\": [\n        {\n          \"ad\": \"Bulaşık Makinesi ve Çevresi\",\n          \"urunler\": [\n            \"Bulaşık makinesi\",\n            { \"ad\": \"Makine tuzu\", \"oncelik\": \"yuksek\" },\n            { \"ad\": \"Parlatıcı\", \"oncelik\": \"orta\" },\n            { \"ad\": \"Küçük parça sepeti\", \"not\": \"kapak, biberon başlığı\" }\n          ]\n        }\n      ]\n    }\n  ]\n}\n\nKurallar:\n- Kategorileri işlevine göre kur; gerekiyorsa \"Bulaşık Makinesi ve Çevresi\" gibi ana ürün artı çevresi mantığında adlandır. Her oda için 4-10 kategori, her kategori için 4-15 ürün.\n- \"ikon\" yalnızca: home, bed, sofa, pot, bath, desk, paw, plant, star, boxr\n- \"renk\" yalnızca: #3F4DBA, #C96A3A, #9BA17B, #A55C7A, #4A3C2F, #EFE7DA, #FCF1C4\n- \"oncelik\" yalnızca: yuksek, orta, dusuk. İlk gün krizi ürünlerini yuksek yap. Emin değilsen alanı hiç yazma.\n- \"not\" alanını yalnızca gerçekten açıklama gerekiyorsa kullan, en fazla birkaç kelime.\n- Fiyat, taksit, mağaza bilgisi YAZMA; onları uygulamada kendim gireceğim.\n- Liste tek çıktıya sığmayacaksa odalara bölerek parça parça ver ve her parçayı ayrı JSON yap. Bana ilk parçayı kurulum ekranına, sonraki parçaları uygulamadaki Ayarlar > Claude ile liste ekle kutusuna yapıştırmam gerektiğini hatırlat; aynı isimli odalar birleşir.\n- En sonda bana şunu sor: \"Bu listede senin normalde aklına gelmeyecek olan neler var?\" ve kendi cevabını da bir iki cümleyle yaz.";

/* toast */
let toastT;
let toastUndo = null;
function toast(msg, opts){
  const o = typeof opts === 'number' ? { ms: opts } : (opts || {});
  const el = $('#toast');
  toastUndo = o.undo || null;
  el.innerHTML = esc(msg) + (toastUndo ? ' <button id="tst-undo">Geri al</button>' : '');
  el.classList.add('in');
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.classList.remove('in'); toastUndo = null; }, o.ms || (toastUndo ? 5200 : 2200));
}

/* sparkle burst micro-interaction */
function sparkle(x, y){
  const b = document.createElement('div');
  b.className = 'spark-burst'; b.style.left = x + 'px'; b.style.top = y + 'px';
  for (let i = 0; i < 6; i++){
    const s = document.createElement('span');
    const a = (i / 6) * Math.PI * 2 + Math.random() * .5;
    const d = 22 + Math.random() * 16;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.textContent = sparkTxt; b.appendChild(s);
  }
  document.body.appendChild(b);
  try { navigator.vibrate?.(12); } catch(e){}
  setTimeout(() => b.remove(), 700);
}

/* sheet stack */
const sheets = [];
function openSheet(html, { onClose } = {}){
  const layers = $('#layers');
  const veil = document.createElement('div'); veil.className = 'veil';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="grab"></div>` + html;
  layers.append(veil, sh);
  requestAnimationFrame(() => { veil.classList.add('in'); sh.classList.add('in'); });
  const rec = { veil, sh, onClose };
  const close = () => closeSheet(rec);
  veil.addEventListener('click', close);
  sh.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if (c) close(); });
  sheets.push(rec);
  document.documentElement.style.overflow = 'hidden';
  return rec;
}
function closeSheet(rec = sheets[sheets.length - 1]){
  if (!rec) return;
  sheets.splice(sheets.indexOf(rec), 1);
  rec.veil.classList.remove('in'); rec.sh.classList.remove('in');
  setTimeout(() => { rec.veil.remove(); rec.sh.remove(); }, 300);
  if (!sheets.length) document.documentElement.style.overflow = '';
  rec.onClose?.();
}
function closeAllSheets(){ while (sheets.length) closeSheet(); }
const sheetHead = (title, sub='') => `
  <div class="sh-h">
    <div><div class="sh-t serif">${title}</div>${sub ? `<div style="font-size:12px;color:var(--ink-2);margin-top:1px">${sub}</div>` : ''}</div>
    <button class="sh-x" data-close aria-label="Kapat">${I.x}</button>
  </div>`;

  $('#cf-ok', rec.sh).addEventListener('click', () => { closeSheet(rec); onOk(); });
}

/* drag-to-sort (pointer based, mobile friendly) */
function makeSortable(container, itemSel, onReorder){
  container.addEventListener('pointerdown', e => {
    const h = e.target.closest('.drag-handle'); if (!h) return;
    const owner = h.closest('.prow,.catblock,.frow');
    if (!owner || !owner.matches(itemSel)) return;               /* handle ait olduğu listede kalsın */
    const item = owner; if (item.parentElement !== container) return;
    e.preventDefault();
    const rect = item.getBoundingClientRect();
    const ghost = item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    Object.assign(ghost.style, { width:rect.width+'px', height:rect.height+'px', left:rect.left+'px', top:rect.top+'px', background:'var(--surface)' });
    document.body.appendChild(ghost);
    const line = document.createElement('div'); line.className = 'drop-line';
    item.classList.add('dragging');
    const dy = e.clientY - rect.top;
    let idx = -1;
    const others = () => $$(itemSel, container).filter(el => el !== item);
    const move = ev => {
      ev.preventDefault();
      const y = ev.clientY;
      ghost.style.top = (y - dy) + 'px';
      if (y < 100) scrollBy(0, -12); else if (y > innerHeight - 120) scrollBy(0, 12);
      const sibs = others();
      idx = sibs.length;
      for (let i = 0; i < sibs.length; i++){
        const r = sibs[i].getBoundingClientRect();
        if (y < r.top + r.height / 2){ idx = i; break; }
      }
      const ref = sibs[idx] || null;
      ref ? container.insertBefore(line, ref) : container.appendChild(line);
    };
    const finish = commit => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      removeEventListener('pointercancel', cancel);
      ghost.remove(); line.remove(); item.classList.remove('dragging');
      if (commit && idx >= 0){
        const sibs = others();
        const ref = sibs[idx] || null;
        ref ? container.insertBefore(item, ref) : container.appendChild(item);
        onReorder($$(itemSel, container).map(el => el.dataset.id));
      }
    };
    const up = () => finish(true);
    const cancel = () => finish(false);
    addEventListener('pointermove', move, { passive:false });
    addEventListener('pointerup', up);
    addEventListener('pointercancel', cancel);
  });
}

function onbLoad(raw){

  if (isManifest(o)){ S = buildFromManifest(o); persistNow(); render(); toast(prodsA().length + ' ürünle kuruldu ' + sparkTxt); return; }
  if (isBackup(o)){

    o.lastSync = 0; S = migrate(o); repairRefs(S); S.meta.welcomed = true; S.meta.setupDone = true;
    persistNow(); render(); toast('Yedek yüklendi ' + sparkTxt); return;

  const withW = prodsA().filter(p => p.warranty)
    .map(p => ({ p, w: p.warranty, d: dleft(p.warranty) }))

  const miss = prodsA().filter(p => isDone(p) && p.acq === 'satin' && !p.warranty);
  const grp = [
    ['Süresi doldu',    withW.filter(x => x.d != null && x.d < 0)],
    ['90 günden az',    withW.filter(x => x.d != null && x.d >= 0 && x.d <= 90)],
    ['Devam ediyor',    withW.filter(x => x.d != null && x.d > 90)],

  ].filter(g => g[1].length);
  const row = x => {

    ].filter(Boolean).join('');
    const meta = [ w.serial ? (/^(sn|seri)/i.test(w.serial) ? esc(w.serial) : 'SN ' + esc(w.serial)) : '', w.invoiceNo ? 'Fatura ' + esc(w.invoiceNo) : '',
                   w.seller ? esc(w.seller) : '', w.service ? 'Servis: ' + esc(w.service) : '' ].filter(Boolean).join(' · ');
    const tag = x.d == null ? '<span class="chip">tarih yok</span>'

    return `<button class="prow" data-prod="${x.p.id}">
      <span class="bd"><span class="nm">${esc(x.p.name)}</span>

function pulseCard(){
  const done = prodsA().filter(isDone);
  const today = new Date(); const dayMs = 864e5;
  const withD = done.filter(p => p.acqDate).sort((a,b) => b.acqDate.localeCompare(a.acqDate));
  let line = null, sub = '';
  if (withD.length){
    const last = withD[0];
    const days = Math.floor((today - new Date(last.acqDate + 'T00:00:00')) / dayMs);
    if (days <= 21){
      line = `Son tamamlanan: <b>${esc(last.name)}</b>`;
      sub = days === 0 ? 'bugün' : days === 1 ? 'dün' : days + ' gün önce';
    }
  }
  if (!line){
    const ym = new Date().toISOString().slice(0, 7);
    const n = done.filter(p => (p.acqDate || '').startsWith(ym)).length;
    if (n) { line = `Bu ay <b>${n} ürün</b> tamamlandı`; sub = 'yol alınıyor'; }
  }
  if (!line){
    const f = finance();
    if (f.month) { line = `Bu ay <b>${fmtMoney(f.month)}</b> taksit ödemesi var`; sub = ymLabel(ymNow()); }
  }
  if (!line) line = `Yol devam ediyor — <b>${daysLeft()} gün</b> var`;
  return `<div class="pulse"><img class="brandmark" src="${BRAND}" alt=""><div class="tx">${line}${sub ? ` <span class="sb">· ${sub}</span>` : ''}</div></div>`;
}
function daysLeft(){
  const d = new Date(S.settings.date + 'T00:00:00');

}

/* V2: her içgörü tipi modül kaydına düşer — tanınmayan tip ana ekranı çökertmez */
