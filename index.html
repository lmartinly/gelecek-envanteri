/* ——— INVENTORY ——— */
function matchesFilters(p){
  if (F.q){ const q = trLow(F.q); if (!trLow(p.name).includes(q) && !trLow(p.brand).includes(q) && !trLow(p.model).includes(q)) return false; }
  if (F.status.length && !F.status.includes(p.status)) return false;
  if (F.prio.length && !F.prio.includes(p.priority)) return false;
  if (F.acq.length && !(p.status === 'tamam' && F.acq.includes(p.acq))) return false;
  if (F.tags.length && !F.tags.every(t => p.tags.includes(t))) return false;
  if (F.roomId && p.roomId !== F.roomId) return false;
  return true;
}
const filtersLive = () => F.q || filterCount() > 0;

function invBody(){
  const searching = filtersLive();
  let body;
  if (searching){
    const hits = prodsA().filter(matchesFilters);
    body = hits.length
      ? `<div class="plist fadein">${hits.slice(0, 200).map(p => prodRow(p, { ctx:true })).join('')}</div>
         ${hits.length > 200 ? `<p class="empty" style="padding:14px">İlk 200 sonuç gösteriliyor</p>` : ''}`
      : `<div class="empty"><img class="brandmark dim" src="${BRAND}" alt=""><div class="t serif">Sonuç yok</div><div class="d">Aramayı veya filtreleri gevşetmeyi dene.</div></div>`;
    body = `<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px">
      <span class="count-b">${hits.length} sonuç</span>
      <button class="act" style="font-size:12.5px;font-weight:800;color:var(--on-indigo)" id="clear-f">Temizle</button></div>` + body;
  } else if (invRoom){
    body = roomDetail(invRoom);
  } else {
    body = `<div class="rooms fadein">${roomsA().map(roomCard).join('')}</div>
      ${sortMode ? `<div class="card" style="margin-top:14px;padding:6px 8px" id="room-sort">${roomsA().map(r =>
        `<div class="frow" data-id="${r.id}" style="padding:10px 8px"><span class="drag-handle">${I.drag}</span><span style="flex:1;font-weight:700">${esc(r.name)}</span>
         <button class="pill" data-edroom="${r.id}" style="padding:5px 11px">${I.pen}</button></div>`).join('')}</div>` : ''}
      <div class="two" style="margin-top:14px">
        <button class="btn ghost sm" style="width:100%;padding:12px" id="add-room">${I.plus} Oda ekle</button>
        <button class="btn ghost sm" style="width:100%;padding:12px" id="sort-rooms">${sortMode ? 'Bitti' : 'Düzenle / Sırala'}</button>
      </div>`;
  }
  return body;
}
function renderInv(){
  return `
  ${pageHead('Oda → Kategori → Ürün', '<em>Envanter</em>')}
  <div class="search">
    ${I.search}
    <input id="q" placeholder="Ürün, marka ara…" value="${esc(F.q)}" autocomplete="off">
    <button class="fbtn" id="open-f" aria-label="Filtreler">${I.filter}${filterCount() ? `<span class="badge">${filterCount()}</span>` : ''}</button>
  </div>
  <div class="pill-row" style="margin:2px 0 10px">
    <button class="pill ${bulkMode ? 'on' : ''}" id="${bulkMode ? 'bulk-off' : 'bulk-on'}">${I.tick} Toplu düzenle</button>
  </div>
  ${bulkBar()}
  <div id="inv-body">${invBody()}</div>`;
}

function roomDetail(rid){
  const r = room(rid);
  if (!r) { invRoom = null; return ''; }
  const cats = catsA(rid);
  const ps = roomProds(rid);
  const pool = progPool(ps);
  const done = pool.filter(isDone).length;
  const pct = pool.length ? Math.round(done / pool.length * 100) : 0;
  const rval = ps.reduce((a, p) => a + (p.listPrice ?? p.price ?? 0), 0);
  return `
  <div class="fadein">
  <button style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--ink-2);margin:2px 0 10px" id="back-rooms">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg> Odalar
  </button>
  <div class="card" style="display:flex;align-items:center;gap:14px;padding:16px">
    <div style="width:44px;height:44px;border-radius:14px;background:${r.color};flex:none;display:grid;place-items:center;color:${lightRoom(r.color) ? 'var(--brown)' : 'var(--cream)'};font-family:var(--serif);font-size:19px">${RICONS[r.icon] || RICONS.home}</div>
    <div style="flex:1;min-width:0">
      <div style="font-family:var(--serif);font-size:20px">${esc(r.name)}</div>
      <div style="font-size:12px;color:var(--ink-2);margin-top:1px">${done}/${pool.length} ürün · %${pct}${rval ? ` · tahmini ${fmtMoney(rval)}` : ''}${S.settings.includeLow ? '' : (ps.length - pool.length ? ` · +${ps.length - pool.length} düşük öncelik` : '')}</div>
      <div class="iprog"><i style="width:${pct}%"></i></div>
    </div>
    <button class="pill" data-edroom="${r.id}" style="padding:7px 12px">${I.pen}</button>
  </div>
  <div class="two" style="margin-top:12px">
    <button class="btn ghost sm" style="width:100%;padding:11px" data-addcat="${rid}">${I.plus} Kategori</button>
    <button class="btn ghost sm" style="width:100%;padding:11px" id="sort-toggle">${sortMode ? 'Sıralama bitti' : 'Sırala'}</button>
  </div>
  ${cats.length ? (sortMode
    ? `<div id="cat-sort" style="margin-top:6px">${cats.map(c => catBlock(c, true)).join('')}</div>`
    : cats.map(c => catBlock(c, false)).join(''))
    : `<div class="empty"><img class="brandmark dim" src="${BRAND}" alt=""><div class="t serif">Henüz kategori yok</div><div class="d">İlk kategoriyi ekleyerek başla.</div></div>`}
  </div>`;
}
function catBlock(c, sortable){
  const ps = catProds(c.id);
  const pool = progPool(ps);
  const done = pool.filter(isDone).length;
  return `<div data-id="${c.id}" class="catblock">
    <div class="cat-h">
      <div style="display:flex;align-items:center;gap:8px">
        ${sortable ? `<span class="drag-handle">${I.drag}</span>` : ''}
        <span class="t">${esc(c.name)}</span>
        <button data-edcat="${c.id}" style="color:var(--ink-3)">${I.pen}</button>
      </div>
      <span class="n">${done}/${pool.length}</span>
    </div>
    ${ps.length ? `<div class="plist" ${sortable ? `data-psort="${c.id}"` : ''}>${ps.map(p => prodRow(p, { sortable })).join('')}</div>`
    : `<div class="plist"><div style="padding:13px 16px;font-size:13px;color:var(--ink-3)">Bu kategoride ürün yok</div></div>`}
  </div>`;
}
function prodRow(p, { ctx = false, sortable = false, dep = false } = {}){
  const done = isDone(p);
  const blocked = !done && isBlocked(p);
  const price = p.price ?? p.listPrice;
  const meta = [];
  if (ctx) meta.push(`${esc(room(p.roomId)?.name || '')} ${sparkTxt} ${esc(cat(p.catId)?.name || '')}`);
  if (dep && blocked) meta.push('bekliyor: ' + esc(openDeps(p)[0].label || ''));
  if (p.brand) meta.push(esc(p.brand));
  if (p.tags.length) meta.push(p.tags.slice(0,2).map(esc).join(', '));
  return `<button class="prow" data-prod="${p.id}" data-idsort="${p.id}" data-id="${p.id}">
    ${bulkMode ? `<span class="tick ${bulkSel.has(p.id) ? 'on' : ''}" data-bulkpick="${p.id}">${bulkSel.has(p.id) ? I.tick : ''}</span>`
      : sortable ? `<span class="drag-handle">${I.drag}</span>`
      : `<span class="tick ${done ? 'on' : ''}" data-tick="${p.id}">${I.tick}</span>`}
    <span class="bd">
      <span class="nm ${done ? 'done' : ''}" style="display:block">${p.priority ? `<span class="prio-dot prio-${p.priority}" style="margin-right:6px;vertical-align:2px"></span>` : ''}${esc(p.name)}</span>
      <span class="mt">${stChip(p)}${meta.length ? `<span style="overflow:hidden;text-overflow:ellipsis">${meta.join(' · ')}</span>` : ''}</span>
    </span>
    ${price != null ? `<span class="pr">${fmtMoney(price)}</span>` : ''}
    ${blocked ? `<span class="dep-badge" title="bağımlılık bekliyor">${I.clock}</span>` : ''}
    ${p.essential ? `<span class="ess-badge" title="temel ihtiyaç">${I.shield}</span>` : ''}
    ${p.alts?.some(a => a.st === 'eval' || a.st === 'favorite') ? `<span style="color:var(--plum);font-size:12px">${sparkTxt}</span>` : ''}
  </button>`;
}
</script>
<script>
/* ——— WISHLIST ——— */
function renderWish(){
  const items = prodsA().filter(p => p.status === 'wishlist' || p.alts.length);
  return `
  ${pageHead('Karşılaştır, seç, arşivle', '<em>Wishlist</em>')}
  ${items.length ? items.map(wishCard).join('') : `
    <div class="empty" style="margin-top:30px"><img class="brandmark dim" src="${BRAND}" alt="">
    <div class="t serif">Wishlist boş</div>
    <div class="d">Bir ürünün durumunu <b>Wishlist</b> yap veya ürün detayından alternatif ekle;<br>karşılaştırma burada yaşar.</div></div>`}`;
}
function wishCard(p){
  const acts = p.alts.filter(a => a.st !== 'rejected');
  const arch = p.alts.filter(a => a.st === 'rejected');
  const prices = acts.map(a => a.price).filter(n => n != null);
  const min = prices.length ? Math.min(...prices) : null;
  return `<div class="card fadein" style="margin-top:14px;padding:16px 16px 12px">
    <button data-prod="${p.id}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left">
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:15.5px">${esc(p.name)}</div>
        <div style="font-size:12px;color:var(--ink-2);margin-top:1px">${esc(room(p.roomId)?.name || '')} · ${esc(cat(p.catId)?.name || '')}</div>
      </div>
      ${stChip(p)}
    </button>
    <div style="margin-top:6px">
    ${acts.length ? acts.map(a => altRow(p, a, min)).join('') : `<div style="font-size:12.5px;color:var(--ink-3);padding:10px 0">Henüz alternatif yok</div>`}
    </div>
    ${arch.length ? `<details><summary style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);padding:8px 0;cursor:pointer;list-style:none">ARŞİV · ${arch.length}</summary>${arch.map(a => altRow(p, a, null)).join('')}</details>` : ''}
    <button class="btn ghost sm" style="margin-top:8px" data-addalt="${p.id}">${I.plus} Alternatif ekle</button>
  </div>`;
}
function altCrit(p, a){
  const cs = p.research?.criteria || [];
  if (!cs.length) return '';
  const CV = { yes:'✓', no:'✕', unknown:'?' };
  return `<div class="alt-crit">${cs.map(c => {
    const v = (a.crit || {})[c.id] || 'unknown';
    return `<button class="ac ac-${v}" data-altcrit="${p.id}|${a.id}|${c.id}" title="${esc(c.label)}">${esc(c.label.slice(0, 14))} ${CV[v]}</button>`;
  }).join('')}</div>`;
}
function altRow(p, a, min){
  const won = a.st === 'selected', archd = a.st === 'rejected';
  const best = min != null && a.price === min && !won;
  return `<div class="alt ${won ? 'won' : ''} ${archd ? 'arch' : ''}">
    <div class="bd" data-altedit='${p.id}|${a.id}' style="cursor:pointer">
      <div class="nm">${esc(a.name)}${a.url ? ` <a href="${esc(a.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--on-indigo);vertical-align:-2px">${I.link}</a>` : ''}</div>
      <div class="mt">${[a.price != null ? fmtMoney(a.price) + (best ? ' · en uygun' : '') : null,
        a.note ? esc(a.note) : null, archd && a.rejectReason ? 'elendi: ' + esc(a.rejectReason) : null].filter(Boolean).join(' · ') || '&nbsp;'}</div>
      ${altCrit(p, a)}
    </div>
    ${won ? `<span class="pk done">Seçildi</span>`
      : archd ? `<button class="pk" data-altback='${p.id}|${a.id}'>Geri al</button>`
      : `<button class="pk" data-altpick='${p.id}|${a.id}'>Bunu seç</button>`}
    ${!won ? `<button style="color:var(--ink-3)" data-altdel='${p.id}|${a.id}'>${I.x}</button>` : ''}
  </div>`;
}

/* ——— FINANCE ——— */
function renderFin(){
  const f = finance();
  const PAL = ['var(--indigo)','var(--terra)','var(--plum)','var(--sage)','var(--brown)','#C9962E'];
  const _seen = {}; let _ci = 0;
  const cc = c => _seen[c] ?? (_seen[c] = PAL[_ci++ % PAL.length]);
  const i0 = ymIdx(ymNow());
  const realSpan = Math.max(12, Math.min(24, f.remMonths));
  const months = Array.from({ length: realSpan }, (_, k) => i0 + k);
  const maxM = Math.max(1, ...months.map(i => Object.values(f.upcoming[i] || {}).reduce((a,b)=>a+b,0)));
  const tots = months.map(i => Object.values(f.upcoming[i] || {}).reduce((a,b)=>a+b,0));
  const dotCls = t => !t ? '' : t <= maxM*.25 ? 'lo' : t <= maxM*.5 ? 'mid' : t <= maxM*.75 ? 'hi' : 'max';
  const ov = [];
  ov.push(['Envanter Değeri', fmtMoney(f.acqVal), `${prodsA().filter(isDone).length} tamamlanan ürün`]);
  ov.push(['Cepten Çıkan', fmtMoney(f.pocket), `${f.pocketCnt} satın alım${f.unpriced ? ` · ${f.unpriced} fiyatsız` : ''}`]);
  ov.push(['Tasarruf', f.savedPct == null ? '—' : '%' + Math.round(f.savedPct * 100), f.savedPct == null ? 'piyasa fiyatı gir' : fmtMoney(f.saved) + ' cepte kaldı']);
  if (f.giftVal) ov.push(['Hediye Değeri', fmtMoney(f.giftVal), 'sevgiyle geldi ' + sparkTxt]);
  if (f.ownedVal) ov.push(['Evde Olanlar', fmtMoney(f.ownedVal), 'zaten senindi']);
  if (f.remainEst) ov.push(['Kalan Alım Tahmini', fmtMoney(f.remainEst), f.remainMiss ? `+${f.remainMiss} ürün fiyatsız` : 'fiyatı bilinenler']);
  if (f.wishEst) ov.push(['Wishlist Tahmini', fmtMoney(f.wishEst), f.wishMiss ? `+${f.wishMiss} fiyatsız` : 'en uygun alternatiflerle']);
  return `
  ${pageHead('Otomatik hesap · elle sıfır', '<em>Finans</em>')}
  <div class="fin-hero">
    <div class="lb">Güncel Kart Borcu <span style="float:right">${sparkTxt}</span></div>
    <div class="big serif">${fmtMoney(f.debt)}</div>
    <div class="row3">
      <div><div class="lb">Bu ay</div><div class="v2">${fmtMoney(f.month)}</div></div>
      <div><div class="lb">Kalan taksit</div><div class="v2">${f.remMonths ? f.remMonths + ' ay' : '—'}</div></div>
      <div><div class="lb">Cepten çıkan</div><div class="v2">${fmtMoney(f.pocket)}</div></div>
    </div>
  </div>

  <div class="section-h"><div class="eyebrow">Genel Bakış</div></div>
  <div class="ovgrid">
    ${ov.map(([l, v, d]) => `<div class="stat"><div class="lb">${l}</div><div class="v serif" style="font-size:19px">${v}</div><div class="sub">${d}</div></div>`).join('')}
  </div>

  <div class="section-h"><div class="eyebrow">Önümüzdeki ${realSpan} Ay</div></div>
  <div class="card" style="padding:14px 14px 12px">
    ${f.lastIdx >= i0 ? `
    <div class="mrows">
      ${months.map((i, k) => {
        const seg = f.upcoming[i] || {}; const tot = tots[k];
        const ym = idxYm(i);
        const mn = new Date(ym + '-01T00:00:00').toLocaleDateString('tr-TR', { month:'short' }).replace('.', '');
        const lab = (k === 0 || ym.endsWith('-01')) ? `${mn} '${ym.slice(2, 4)}` : mn;
        const prev = k ? tots[k - 1] : 0;
        const mom = k && prev > 0 && tot > 0 ? Math.round((tot - prev) / prev * 100) : null;
        return `<button class="mrow ${tot ? '' : 'zero'}" data-mon="${i}">
          <span class="mr-dot ${dotCls(tot)}"></span>
          <span class="mr-l">${lab}</span>
          <span class="mr-track">${tot ? Object.entries(seg).map(([c, v]) =>
            `<i style="width:${v / maxM * 100}%;background:${cc(c)}"></i>`).join('') : ''}</span>
          <span class="mr-v">${tot ? fmtMoney(tot) : '—'}${mom != null && mom !== 0 ? `<span class="mom">${mom < 0 ? '↓' : '↑'}${Math.abs(mom)}%</span>` : ''}</span>
        </button>`; }).join('')}
    </div>
    <div class="legend">${Object.entries(f.cards).map(([c, v]) => `<span class="lg"><i style="background:${cc(c)}"></i>${esc(c)} · ${fmtMoney(v)}</span>`).join('')}</div>`
    : `<div class="empty" style="padding:14px"><img class="brandmark dim" src="${BRAND}" alt=""><div class="d">Aktif taksit planı yok — peşin gidiyorsun ${sparkTxt}</div></div>`}
  </div>

  ${(() => { const instP = prodsA().filter(p => isBought(p) && p.instCount && p.price != null && p.instStart);
    if (!instP.length) return '';
    return `
  <div class="section-h"><div class="eyebrow">Taksitli Ürünler</div></div>
  <div class="card plist" style="padding:4px 6px">
    ${instP.map(p => { const x = finOf(p); return `
      <button class="prow" data-prod="${p.id}">
        <span class="bd">
          <span class="nm">${esc(p.name)}</span>
          <span class="mt">${esc(p.card || 'Kart yok')} · ayda ${fmtMoney(x.monthly)} · ${x.paid}/${p.instCount}</span>
          <span class="iprog"><i style="width:${x.paid / p.instCount * 100}%"></i></span>
        </span>
        <span class="pr">${fmtMoney(x.remain)}</span>
      </button>`; }).join('')}
  </div>`; })()}`;
}

function renderSet(){
  const themes = [['system','Oto'],['light','Açık'],['dark','Koyu']];
  const syncOn = !!S.settings.clientId && Sync.enabled();
  const dot = Sync.status === 'ok' ? 'ok' : (Sync.status === 'error' || Sync.status === 'noauth') ? 'err' : 'off';
  const stTxt = { off:'Kapalı', ok:'Bağlı', syncing:'Eşitleniyor…', error:'Hata', noauth:'Yeniden bağlan' }[Sync.status] || 'Kapalı';
  return `
  ${pageHead('Kişiselleştir', '<em>Ayarlar</em>')}
  <div class="section-h"><div class="eyebrow">Hedef</div></div>
  <div class="card" style="padding:5px 0">
    <button class="set-row" id="ed-count"><span><span class="k">Geri sayım</span><div class="d">${esc(S.settings.title)} · ${fmtDateTR(S.settings.date)}</div></span><span class="v">${I.right}</span></button>
  </div>

  <div class="section-h"><div class="eyebrow">Görünüm</div></div>
  <div class="card" style="padding:5px 0">
    <div class="set-row"><span class="k">Tema</span>
      <div class="seg-ctl">${themes.map(([id,l]) => `<button data-theme-set="${id}" class="${S.settings.theme === id ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
    <div class="set-row"><span class="k">Para birimi</span>
      <div class="seg-ctl">${['₺','€','$'].map(c => `<button data-cur="${c}" class="${S.settings.currency === c ? 'on' : ''}">${c}</button>`).join('')}</div>
    </div>
    <div class="set-row"><span><span class="k">Yaşam dönemi</span><div class="d">Ana ekranın neyi öne çıkaracağını belirler. Veri silinmez, geri alınabilir.</div></span>
      <div class="seg-ctl">${ERAS.map(e2 => `<button data-era="${e2.id}" class="${ERA() === e2.id ? 'on' : ''}">${e2.label}</button>`).join('')}</div>
    </div>
    <div class="set-row"><span><span class="k">Oda ilerlemesi</span><div class="d">Düşük öncelikliler bilinçli olarak sona bırakılmış işler; kapalıyken yüzdeye girmezler.</div></span>
      <div class="seg-ctl">${[['0','Hariç'],['1','Dahil']].map(([v,l]) => `<button data-inclow="${v}" class="${(S.settings.includeLow ? '1' : '0') === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
  </div>

  <div class="section-h"><div class="eyebrow">Eşitleme</div></div>
  <div class="card" style="padding:5px 0">
    <div class="set-row"><span><span class="k">Google Drive</span><div class="d">Veriler kendi Drive'ında, uygulamaya özel gizli klasörde saklanır.</div></span>
      <span class="v"><span class="sync-dot ${dot}"></span>${stTxt}</span></div>
    <div style="padding:4px 16px 14px">
      <input class="inp" id="cid" placeholder="Google OAuth Client ID (…apps.googleusercontent.com)" value="${esc(S.settings.clientId)}" autocomplete="off" style="font-size:12.5px">
      <div class="two">
        <button class="btn sm ghost" style="width:100%" id="sync-save">Kaydet</button>
        ${syncOn ? `<button class="btn sm ghost" style="width:100%" id="sync-off">Bağlantıyı kes</button>`
                  : `<button class="btn sm" style="width:100%;background:var(--indigo);color:var(--cream)" id="sync-on">${I.cloud} Bağlan</button>`}
      </div>
      ${Sync.lastAt ? `<div style="font-size:11px;color:var(--ink-3);margin-top:8px">Son eşitleme: ${new Date(Sync.lastAt).toLocaleString('tr-TR')}</div>` : ''}
      <div style="font-size:11px;color:var(--ink-3);margin-top:6px">Kurulum adımları README dosyasında.</div>
    </div>
  </div>

  <div class="section-h"><div class="eyebrow">Gelişmiş</div></div>
  <div class="card" style="padding:5px 0">
    <button class="set-row" id="add-claude"><span><span class="k">Claude ile liste ekle</span><div class="d">Yeni oda/kategori/ürün ekle — mevcut veriye dokunmaz</div></span>${I.right}</button>
    <button class="set-row" id="exp-json"><span class="k">Verileri dışa aktar</span><span class="v">JSON</span></button>
    <button class="set-row" id="imp-json"><span class="k">Yedekten geri yükle</span><span class="v">JSON</span></button>
    <button class="set-row" id="reset-all"><span class="k" style="color:var(--terra)">Tüm verileri sıfırla</span><span class="v"></span></button>
    <input type="file" id="imp-file" accept="application/json" class="hidden">
  </div>
  <p style="text-align:center;font-size:11px;color:var(--ink-3);margin-top:22px">Gelecek Envanteri ${sparkTxt} v${VERSION}${store.persistent ? '' : ' · <b style="color:var(--terra)">geçici depolama modu</b>'}</p>`;
}
</script>
<script>
/* ═══════════════════ SHEETS ═══════════════════ */

/* — product detail — */
function productSheet(pid){
  const p = prod(pid); if (!p) return;
  const rec = openSheet(`
    ${sheetHead(esc(p.name), `${esc(room(p.roomId)?.name || '')} · ${esc(cat(p.catId)?.name || '')}`)}
    <div class="sh-b" id="ps">
      <div class="sect always">
        <div class="in">
          <div class="frow"><span class="k">Ürün adı</span><span class="v"><input data-f="name" value="${esc(p.name)}"></span></div>
          <div class="frow"><span class="k">Konum</span><span class="v"><button data-move="${p.id}" style="color:var(--on-indigo);font-weight:700">${esc(room(p.roomId)?.name)} · ${esc(cat(p.catId)?.name)} ${I.right}</button></span></div>
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Durum</span><div class="pill-row" id="ps-st">${statusChips(p.status)}</div></div>
          <div class="frow hidden" id="ps-acq-w" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Edinim</span><div class="pill-row" id="ps-acq"></div></div>
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Öncelik</span><div class="pill-row" id="ps-pr">${prioChips(p.priority)}</div></div>
          <div class="frow"><span class="k">Marka</span><span class="v"><input data-f="brand" value="${esc(p.brand)}" placeholder="Ekle"></span></div>
          <div class="frow"><span class="k">Model</span><span class="v"><input data-f="model" value="${esc(p.model)}" placeholder="Ekle"></span></div>
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:6px">Notlar</span><textarea class="inp" data-f="notes" rows="2" placeholder="Kendine not…" style="border:0;padding:2px 0;background:none;min-height:auto">${esc(p.notes)}</textarea></div>
        </div>
      </div>

      <details class="sect" id="ps-sec-plan">
        <summary>Planlama ${I.chev}</summary>
        <div class="in">
          <div class="frow"><span class="k">Satın alma fazı</span><span class="v"><button data-psphase="${p.id}" style="color:var(--on-indigo);font-weight:700" id="ps-ph">—</button></span></div>
          <div class="frow"><span class="k">Temel ihtiyaç</span><span class="v"><button id="ps-ess" class="pill" style="padding:5px 12px">—</button></span></div>
          <div class="frow hidden" id="ps-fn-w" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Hangi yaşam fonksiyonu</span><div class="pill-row" id="ps-fn"></div></div>
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Ekosistemler</span><div class="pill-row" id="ps-eco"></div></div>
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Bağımlılıklar</span><div id="ps-deps"></div></div>
        </div>
      </details>

      <details class="sect" id="ps-sec-res">
        <summary>Araştırma ${I.chev}</summary>
        <div class="in">
          <div class="sub-h">Satın alma kriterleri</div>
          <div id="ps-crit"></div>
          <div class="sub-h" style="margin-top:16px">Alışveriş bağlantıları</div>
          <div id="ps-links"></div>
          <div class="sub-h" style="margin-top:16px">Alternatifler</div>
          <div id="ps-alts"></div>
        </div>
      </details>

      <details class="sect" id="ps-sec-buy">
        <summary>Satın Alma ${I.chev}</summary>
        <div class="in" id="ps-buy"></div>
      </details>

      <details class="sect" id="ps-sec-org" ${p.tags.length ? 'open' : ''}>
        <summary>Düzenleme ${I.chev}</summary>
        <div class="in">
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Etiketler</span><div class="pill-row" id="ps-tg"></div></div>
          <div class="frow" style="display:block"><span class="k" style="display:block;margin-bottom:8px">Uyumluluk</span><div class="pill-row" id="ps-cp"></div></div>
          <div class="frow"><span class="k">Koli / konum</span><span class="v"><button id="ps-box" style="color:var(--on-indigo);font-weight:700">—</button></span></div>
        </div>
      </details>

      <details class="sect" id="ps-sec-war">
        <summary>Garanti & Belgeler ${I.chev}</summary>
        <div class="in" id="ps-war"></div>
      </details>

      <button class="btn danger" data-delprod="${p.id}">${I.trash} Ürünü sil</button>
      <datalist id="cards-dl">${usedCards().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <datalist id="stores-dl">${[...new Set(prodsA().map(x => x.store).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    </div>`);

  const sh = rec.sh;

  const hasResearch = () => p.links.length || p.alts.length;
  const hasBuyData = () => p.listPrice != null || p.price != null || p.store || p.instCount;

  const COMPAT = ['Matter','Apple Home','Wi-Fi','Bluetooth','HDMI 2.1','DreamView','Thread','Zigbee'];
  const refreshPlan = () => {
    const ph = p.phaseId ? phase(p.phaseId) : null;
    $('#ps-ph', sh).innerHTML = (ph ? esc(ph.name) : 'Atanmamış') + ' ' + I.right;
    const eb = $('#ps-ess', sh);
    eb.className = 'pill' + (p.essential ? ' on' : '');
    eb.textContent = p.essential ? 'Evet — taşınmak için gerekli' : 'Hayır';
    $('#ps-fn-w', sh).classList.toggle('hidden', !p.essential);
    if (p.essential){
      const fns = fnsA();
      $('#ps-fn', sh).innerHTML = fns.length
        ? fns.map(f => `<button class="pill ${(p.fnIds||[]).includes(f.id)?'on':''}" data-psfn="${f.id}">${esc(f.name)}</button>`).join('')
        : `<button class="pill" id="ps-fnseed">${I.plus} Fonksiyonları kur</button>`;
    }
    const ecs = ecosA();
    $('#ps-eco', sh).innerHTML = (ecs.length
      ? ecs.map(e2 => `<button class="pill ${(p.ecosystemIds||[]).includes(e2.id)?'on':''}" data-pseco="${e2.id}">${esc(e2.name)}</button>`).join('')
      : '') + `<button class="pill" id="ps-ecoadd">${I.plus} Ekosistem</button>`;
    const deps = p.deps || [];
    $('#ps-deps', sh).innerHTML = (deps.length ? deps.map(d => {
      const ok = depDone(d);
      return `<div class="dep-row ${ok ? 'ok' : ''}">
        <button class="tick ${ok ? 'on' : ''}" ${d.kind === 'manual' ? `data-psdepx="${d.id}"` : 'disabled'}>${ok ? I.tick : ''}</button>
        <span class="bd"><span class="nm">${esc(d.label || depAutoLabel(d))}</span>
          <span class="mt">${ok ? 'çözüldü' : 'bekliyor'} · ${({product:'ürün',milestone:'dönüm noktası',measurement:'ölçü',listing:'ev',manual:'elle'})[d.kind]}</span></span>
        <button class="x" data-psdepd="${d.id}">${I.x}</button></div>`; }).join('')
      : '<div style="font-size:12.5px;color:var(--ink-3);padding:2px 0 8px">Bu ürün başka bir şeyi bekliyorsa buraya ekle; bekleyen ürünler Roadmap’te gerekçesiyle görünür.</div>')
      + `<button class="btn ghost sm" style="margin-top:8px" data-psdepadd="${p.id}">${I.plus} Bağımlılık ekle</button>`;
  };
  const refreshOrg = () => {
    $('#ps-cp', sh).innerHTML = COMPAT.map(c =>
      `<button class="pill ${(p.compat||[]).includes(c)?'on':''}" data-pscp="${esc(c)}">${c}</button>`).join('');
    const b = p.boxId ? box(p.boxId) : null;
    $('#ps-box', sh).innerHTML = (b ? `${esc(b.code)} · ${esc(b.name || '')}` : (p.storageLoc ? esc(p.storageLoc) : 'Atanmamış')) + ' ' + I.right;
  };
  const refreshWar = () => {
    const w = p.warranty;
    if (!isDone(p)){ $('#ps-war', sh).innerHTML =
      '<div style="font-size:12.5px;color:var(--ink-3)">Ürün tamamlandığında garanti ve belge alanları açılır.</div>'; return; }
    if (!w){ $('#ps-war', sh).innerHTML =
      `<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:10px">Seri no, fatura, kılavuz ve garanti süresini buraya kaydedebilirsin.</div>
       <button class="btn ghost sm" id="ps-waradd">${I.plus} Garanti bilgisi ekle</button>`; return; }
    const endTxt = w.end ? fmtDateTR(w.end) : '—';
    const days = w.end ? Math.round((new Date(w.end + 'T00:00:00') - new Date()) / 864e5) : null;
    $('#ps-war', sh).innerHTML = `
      <div class="frow"><span class="k">Seri no</span><span class="v"><input data-w="serial" value="${esc(w.serial||'')}" placeholder="—"></span></div>
      <div class="frow"><span class="k">Fatura no</span><span class="v"><input data-w="invoiceNo" value="${esc(w.invoiceNo||'')}" placeholder="—"></span></div>
      <div class="frow"><span class="k">Fatura linki</span><span class="v"><input data-w="invoiceUrl" value="${esc(w.invoiceUrl||'')}" placeholder="https://…" inputmode="url"></span></div>
      <div class="frow"><span class="k">Kılavuz linki</span><span class="v"><input data-w="manualUrl" value="${esc(w.manualUrl||'')}" placeholder="https://…" inputmode="url"></span></div>
      <div class="frow"><span class="k">Satıcı</span><span class="v"><input data-w="seller" value="${esc(w.seller||'')}" placeholder="—"></span></div>
      <div class="frow"><span class="k">Servis</span><span class="v"><input data-w="service" value="${esc(w.service||'')}" placeholder="—"></span></div>
      <div class="frow"><span class="k">Başlangıç</span><span class="v"><input data-w="start" type="date" value="${w.start||''}"></span></div>
      <div class="frow"><span class="k">Süre (ay)</span><span class="v"><input data-w="months" inputmode="numeric" value="${w.months??''}" placeholder="24"></span></div>
      <div class="frow"><span class="k">Bitiş</span><span class="v ghosty">${endTxt}${days != null ? (days < 0 ? ' · doldu' : ` · ${days} gün`) : ''}</span></div>
      <p style="font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:8px">Dosyalar link olarak tutulur; büyük PDF’ler cihaz depolamasına yazılmaz.</p>`;
  };
  const refreshAcq = () => {
    const w = $('#ps-acq-w', sh);
    w.classList.toggle('hidden', p.status !== 'tamam');
    if (p.status === 'tamam')
      $('#ps-acq', sh).innerHTML = ACQS.map(a => `<button class="pill ${p.acq === a.id ? 'on' : ''}" data-acq="${a.id}">${a.label}</button>`).join('');
  };

  let pendM = p.instStart?.slice(5) || '', pendY = p.instStart?.slice(0, 4) || '';
  const buyRows = () => {
    const satin = p.acq === 'satin' || p.status !== 'tamam';
    let h = `<div class="frow"><span class="k">Piyasa fiyatı</span><span class="v"><input data-money="listPrice" inputmode="decimal" value="${p.listPrice ?? ''}" placeholder="—"></span></div>`;
    if (satin) h += `
      <div class="frow"><span class="k">Alış fiyatı</span><span class="v"><input data-money="price" inputmode="decimal" value="${p.price ?? ''}" placeholder="—"></span></div>
      <div class="frow"><span class="k">Mağaza</span><span class="v"><input data-f="store" value="${esc(p.store)}" placeholder="Ekle" list="stores-dl"></span></div>`;
    if (satin) h += `
      <div class="frow"><span class="k">Kredi kartı</span><span class="v"><input data-f="card" value="${esc(p.card)}" placeholder="Ekle" list="cards-dl"></span></div>
      <div class="frow"><span class="k">Taksit sayısı</span><span class="v"><input data-int="instCount" inputmode="numeric" value="${p.instCount ?? ''}" placeholder="—"></span></div>
      <div class="frow"><span class="k">Taksit başlangıcı</span><span class="v" style="display:flex;gap:6px;justify-content:flex-end">
        <select data-instm style="font:inherit;font-weight:600;color:inherit;background:none;text-align:right"><option value="">— Ay</option>${['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'].map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${pendM===v?'selected':''}>${m}</option>`;}).join('')}</select>
        <select data-insty style="font:inherit;font-weight:600;color:inherit;background:none"><option value="">Yıl</option>${Array.from({length:9},(_,i)=>2024+i).map(y=>`<option ${pendY==String(y)?'selected':''}>${y}</option>`).join('')}</select>
      </span></div>
      <div class="frow"><span class="k">Hesap</span><span class="v ghosty" id="ps-buy-v"></span></div>`;
    else if (p.status === 'tamam') h += `<div style="font-size:12px;color:var(--ink-3);padding:8px 0 2px">${p.acq === 'hediye' ? 'Hediye — cebinden çıkmadı; piyasa fiyatı tasarrufuna yazılır.' : 'Zaten vardı — cebinden çıkmadı; piyasa fiyatı tasarrufuna yazılır.'}</div>`;
    return h;
  };
  const refreshCalc = () => {
    const v = $('#ps-buy-v', sh);
    if (v){
      const x = finOf(p);
      v.textContent = x.monthly
        ? `ayda ${fmtMoney(x.monthly)} · ${x.paid}/${p.instCount} ödendi · kalan ${fmtMoney(x.remain)}`
        : p.price == null ? 'önce alış fiyatını gir'
        : !p.instCount ? 'Peşin ödeme · taksit yok'
        : 'taksit başlangıç ayını seç';
    }
    const sec = $('#ps-sec-buy', sh);
    let nud = $('#ps-nudge', sh);
    if (p.status === 'tamam' && !hasBuyData()){
      sec.open = true;
      if (!nud){
        nud = document.createElement('div'); nud.id = 'ps-nudge';
        nud.style.cssText = 'font-size:12px;color:var(--terra);padding:0 0 8px';
        nud.textContent = 'Tamamlandı ' + sparkTxt + ' — istersen fiyat bilgilerini de ekleyelim.';
        $('#ps-buy', sh).prepend(nud);
      }
    } else if (nud) nud.remove();
  };
  const refreshBuy = () => { $('#ps-buy', sh).innerHTML = buyRows(); refreshCalc(); };
  const refreshTags = () => {
    $('#ps-tg', sh).innerHTML = p.tags.map(t =>
      `<span class="pill on" style="gap:7px">${esc(t)}<button data-rmtag="${esc(t)}" style="color:inherit;opacity:.7">${I.x}</button></span>`).join('')
      + `<button class="pill" id="ps-addtag">${I.plus} Etiket</button>`;
  };
  const refreshCrit = () => {
    const cs = p.research?.criteria || [];
    $('#ps-crit', sh).innerHTML = (cs.length ? cs.map(c => `<div class="frow">
      <span class="k">${c.required ? '★ ' : ''}${esc(c.label)}</span>
      <span class="v" style="display:flex;gap:8px;align-items:center">
        <button class="pill" data-crq="${c.id}" style="padding:4px 9px;font-size:11px">${c.required ? 'zorunlu' : 'tercih'}</button>
        <button data-crd="${c.id}" style="color:var(--terra)">${I.x}</button></span></div>`).join('')
      : '<div style="font-size:12.5px;color:var(--ink-3);padding:2px 0 6px">Kriter ekle, alternatifleri bu kriterlere göre karşılaştır.</div>')
      + `<button class="btn ghost sm" style="margin-top:8px" id="ps-critadd">${I.plus} Kriter ekle</button>`;
  };
  const refreshAlts = () => {
    const acts = p.alts.filter(a => a.st !== 'rejected'), arch = p.alts.filter(a => a.st === 'rejected');
    const prices = acts.map(a => a.price).filter(n => n != null);
    const min = prices.length ? Math.min(...prices) : null;
    $('#ps-alts', sh).innerHTML =
      (p.alts.length ? acts.map(a => altRow(p, a, min)).join('') + arch.map(a => altRow(p, a, null)).join('') : `<div style="font-size:12.5px;color:var(--ink-3);padding:4px 0">Alternatif ekle, fiyatları yan yana gör — burası karar masası.</div>`)
      + `<button class="btn ghost sm" style="margin-top:10px" data-addalt="${p.id}">${I.plus} Alternatif ekle</button>`;
  };
  const refreshLinks = () => {
    $('#ps-links', sh).innerHTML =
      p.links.map(l => `<div class="linkrow">
        <span style="color:var(--on-indigo)">${I.link}</span>
        <a class="u" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</a>
        <button class="x" data-rmlink="${l.id}">${I.x}</button></div>`).join('')
      + `<button class="btn ghost sm" style="margin-top:8px" id="ps-addlink">${I.plus} Bağlantı ekle</button>`;
  };
  const refreshOpen = () => {
    $('#ps-sec-res', sh).open = hasResearch() || ['arastiriliyor','wishlist'].includes(p.status);
    if (p.status === 'tamam' && hasBuyData()) $('#ps-sec-buy', sh).open = true;
  };
  refreshAcq(); refreshBuy(); refreshTags(); refreshAlts(); refreshLinks(); refreshOpen();
  refreshPlan(); refreshOrg(); refreshWar(); refreshCrit();

  sh.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.f !== undefined){
      const k = t.dataset.f, v = t.value.trim();
      if (k === 'name' && !v){ t.value = p.name; return; }
      p[k] = v;
      touch(p); save({ silent:true }); refreshCalc();
      if (k === 'name') $('.sh-t', sh).textContent = p.name;
      render();
    }
    if (t.dataset.money !== undefined){ p[t.dataset.money] = parseMoney(t.value); touch(p); save({silent:true}); refreshCalc(); render(); }
    if (t.dataset.int !== undefined){ const n = parseInt(t.value, 10); p[t.dataset.int] = isNaN(n) || n < 0 ? null : n; touch(p); save({silent:true}); refreshCalc(); render(); }
    if (t.dataset.instm !== undefined || t.dataset.insty !== undefined){
      pendM = $('[data-instm]', sh).value;
      pendY = $('[data-insty]', sh).value;
      p.instStart = pendM && pendY ? `${pendY}-${pendM}` : null;
      touch(p); save({silent:true}); refreshCalc(); render();
    }
  });
  sh.addEventListener('click', e => {
    const st = e.target.closest('[data-st]');
    if (st){ setStatus(p, st.dataset.st, e); $('#ps-st', sh).innerHTML = statusChips(p.status); refreshAcq(); refreshBuy(); refreshOpen(); return; }
    const aq = e.target.closest('[data-acq]');
    if (aq){ setAcq(p, aq.dataset.acq); refreshAcq(); refreshBuy(); return; }
    const pr = e.target.closest('[data-prio]');
    if (pr){ p.priority = pr.dataset.prio || null; touch(p); save({silent:true}); $('#ps-pr', sh).innerHTML = prioChips(p.priority); render(); return; }
    const rt = e.target.closest('[data-rmtag]');
    if (rt){ p.tags = p.tags.filter(x => x !== rt.dataset.rmtag); touch(p); save({silent:true}); refreshTags(); render(); return; }
    if (e.target.closest('#ps-addtag')){ tagPickSheet(p, refreshTags); return; }
    if (e.target.closest('#ps-addlink')){ linkSheet(p, refreshLinks); return; }
    const rl = e.target.closest('[data-rmlink]');
    if (rl){ p.links = p.links.filter(l => l.id !== rl.dataset.rmlink); touch(p); save({silent:true}); refreshLinks(); return; }
    const mv = e.target.closest('[data-move]');
    if (mv){ moveSheet(p, () => { closeSheet(rec); productSheet(p.id); }); return; }
    const dp = e.target.closest('[data-delprod]');
    if (dp){ confirmSheet({ title:'Ürünü sil', body:`<b>${esc(p.name)}</b> envanterden kaldırılacak.`, okLabel:'Sil', danger:true }, () => { p.deleted = now(); touch(p); save(); closeSheet(rec); toast('Ürün silindi'); }); return; }
    if (handleAltClick(e, () => { refreshAlts(); })) return;

    /* ── planlama ── */
    if (e.target.closest('[data-psphase]')){ phasePick(p, () => { refreshPlan(); render(); }); return; }
    if (e.target.closest('#ps-ess')){
      p.essential = !p.essential;
      if (p.essential && !fnsA().length) seedFunctions();
      if (!p.essential) p.fnIds = [];
      touch(p); save({silent:true}); refreshPlan(); render(); return;
    }
    if (e.target.closest('#ps-fnseed')){ seedFunctions(); refreshPlan(); return; }
    const pf = e.target.closest('[data-psfn]');
    if (pf){ const id = pf.dataset.psfn; p.fnIds = (p.fnIds||[]).includes(id) ? p.fnIds.filter(x=>x!==id) : [...(p.fnIds||[]), id];
      touch(p); save({silent:true}); refreshPlan(); render(); return; }
    const pe = e.target.closest('[data-pseco]');
    if (pe){ const id = pe.dataset.pseco; p.ecosystemIds = (p.ecosystemIds||[]).includes(id) ? p.ecosystemIds.filter(x=>x!==id) : [...(p.ecosystemIds||[]), id];
      touch(p); save({silent:true}); refreshPlan(); render(); return; }
    if (e.target.closest('#ps-ecoadd')){ ecoSheet(); return; }
    const dx = e.target.closest('[data-psdepx]');
    if (dx){ const d = p.deps.find(x => x.id === dx.dataset.psdepx); if (d){ d.done = !d.done; touch(p); save({silent:true}); refreshPlan(); render(); } return; }
    const dd = e.target.closest('[data-psdepd]');
    if (dd){ p.deps = p.deps.filter(x => x.id !== dd.dataset.psdepd); touch(p); save({silent:true}); refreshPlan(); render(); return; }
    if (e.target.closest('[data-psdepadd]')){ depSheet(p, () => { refreshPlan(); render(); }); return; }

    /* ── düzenleme ── */
    const cp = e.target.closest('[data-pscp]');
    if (cp){ const v = cp.dataset.pscp; p.compat = (p.compat||[]).includes(v) ? p.compat.filter(x=>x!==v) : [...(p.compat||[]), v];
      touch(p); save({silent:true}); refreshOrg(); return; }
    if (e.target.closest('#ps-box')){ boxPick(p, () => refreshOrg()); return; }

    /* ── araştırma kriterleri ── */
    if (e.target.closest('#ps-critadd')){
      critAddSheet(p, () => { refreshCrit(); refreshAlts(); }); return;
    }
    const cq = e.target.closest('[data-crq]');
    if (cq){ const c = p.research.criteria.find(x => x.id === cq.dataset.crq); if (c){ c.required = !c.required; touch(p); save({silent:true}); refreshCrit(); } return; }
    const cd = e.target.closest('[data-crd]');
    if (cd){ p.research.criteria = p.research.criteria.filter(x => x.id !== cd.dataset.crd);
      (p.alts||[]).forEach(a => { if (a.crit) delete a.crit[cd.dataset.crd]; });
      touch(p); save({silent:true}); refreshCrit(); refreshAlts(); return; }
    const ac = e.target.closest('[data-altcrit]');
    if (ac){ const [, aid, cid] = ac.dataset.altcrit.split('|');
      const a = p.alts.find(x => x.id === aid); if (a){ a.crit ??= {};
        const cur = a.crit[cid] || 'unknown';
        a.crit[cid] = cur === 'unknown' ? 'yes' : cur === 'yes' ? 'no' : 'unknown';
        p.research.lastAt = now(); touch(p); save({silent:true}); refreshAlts(); } return; }

    /* ── garanti ── */
    if (e.target.closest('#ps-waradd')){
      p.warranty = { serial:'', invoiceNo:'', invoiceUrl:'', manualUrl:'', seller: p.store || '', service:'',
        start: p.acqDate || null, months: null, end: null, extMonths: 0, note:'' };
      touch(p); save({silent:true}); refreshWar(); return;
    }
  });

  /* garanti alanları */
  sh.addEventListener('change', e => {
    const k = e.target.dataset.w; if (!k || !p.warranty) return;
    const w = p.warranty;
    if (k === 'months'){ const n = parseInt(e.target.value, 10); w.months = isNaN(n) || n <= 0 ? null : n; }
    else w[k] = e.target.value.trim();
    if (w.start && w.months){
      const d = new Date(w.start + 'T00:00:00');
      d.setMonth(d.getMonth() + w.months + (w.extMonths || 0));
      w.end = d.toISOString().slice(0, 10);
    } else w.end = null;
    touch(p); save({silent:true}); refreshWar();
  });
}

function setStatus(p, st, e){
  if (st === p.status) return;
  if (st === 'tamam' && !isDone(p)){
    p.prevStatus = p.status;
    p.acq = p.acq || 'satin';
    p.purchasedAt = now();
    p.acqDate = p.acqDate || new Date().toISOString().slice(0, 10);
    if (e) sparkle(e.clientX || innerWidth/2, e.clientY || innerHeight/2);
    toast('Tamamlandı ' + sparkTxt);
  }
  if (st !== 'tamam'){ p.acq = null; p.purchasedAt = null; }
  p.status = st; touch(p); save({ silent:true }); render();
}
function setAcq(p, acq){
  if (p.status !== 'tamam' || p.acq === acq) return;
  p.acq = acq; touch(p); save({ silent:true }); render();
}

function handleAltClick(e, after = () => {}){
  const pick = e.target.closest('[data-altpick]');
  if (pick){
    const [pid, aid] = pick.dataset.altpick.split('|');
    const p = prod(pid), a = p.alts.find(x => x.id === aid);
    confirmSheet({ title:'Bunu seç ' + sparkTxt, body:`<b>${esc(a.name)}</b> seçilecek; diğer alternatifler arşive kalkacak. Marka ve fiyat ürüne yazılır.`, okLabel:'Seç' }, () => {
      p.alts.forEach(x => x.st = x.id === aid ? 'selected' : 'rejected');
      if (!p.brand) p.brand = a.name;
      if (a.price != null && p.price == null) p.price = a.price;
      if (a.url && !p.links.find(l => l.url === a.url)) p.links.push({ id:uid(), url:a.url, label:a.name });
      if (p.status === 'wishlist' || p.status === 'arastiriliyor') p.status = 'alinacak';
      touch(p); save(); after(); sparkle(e.clientX, e.clientY); toast('Seçildi — diğerleri arşivde');
    });
    return true;
  }
  const back = e.target.closest('[data-altback]');
  if (back){ const [pid, aid] = back.dataset.altback.split('|'); const p = prod(pid); p.alts.find(x => x.id === aid).st = 'eval'; touch(p); save(); after(); return true; }
  const del = e.target.closest('[data-altdel]');
  if (del){ const [pid, aid] = del.dataset.altdel.split('|'); const p = prod(pid); p.alts = p.alts.filter(x => x.id !== aid); touch(p); save(); after(); return true; }
  const add = e.target.closest('[data-addalt]');
  if (add){ altSheet(prod(add.dataset.addalt), null, after); return true; }
  const ed = e.target.closest('[data-altedit]');
  if (ed){ const [pid, aid] = ed.dataset.altedit.split('|'); const p = prod(pid); altSheet(p, p.alts.find(x => x.id === aid), after); return true; }
  return false;
}

    if (openAfter) productSheet(p.id);
  };
  $('#qa-ok', sh).addEventListener('click', () => doSave(false));
  $('#qa-more', sh).addEventListener('click', () => doSave(true));
  $('#qa-nm', sh).addEventListener('keydown', e => { if (e.key === 'Enter') doSave(false); });

const RICON_KEYS = ['home','bed','sofa','pot','bath','desk','paw','plant','star','boxr'];
function readManifest(raw){
  let o;
  try {
    const m = String(raw).match(/\{[\s\S]*\}/);        /* kod bloğu ve açıklama artıklarını tolere et */
    o = JSON.parse(m ? m[0] : raw);
  } catch(_) { throw new Error('Bu metin geçerli bir JSON değil — Claude çıktısının tamamını kopyaladığından emin ol.'); }
  return o;
}
const isManifest = o => !!(o && (Array.isArray(o.odalar) || Array.isArray(o.rooms)) && !Array.isArray(o.products));
const isBackup   = o => !!(o && Array.isArray(o.products) && Array.isArray(o.rooms));
const mfRooms    = o => (o.odalar || o.rooms || []);
const mfCats     = r => (r.kategoriler || r.categories || []);
const mfProds    = c => (c.urunler || c.products || c.items || []);
const mfPrio     = v => ['yuksek','orta','dusuk'].includes(v) ? v : null;

/* v3 ürün varsayılanları — TEK kaynak; her yaratma yolu bunu kullanır */
function p3(){ return { phaseId:null, essential:false, fnIds:[], ecosystemIds:[], deps:[], compat:[],
  boxId:null, storageLoc:'', providedBy:null,
  research:{ status:'todo', criteria:[], notes:'', lastAt:null }, warranty:null }; }
function newProduct(o, rid, cid, t, ord){
  const p = typeof o === 'string' ? { ad:o } : (o || {});
  const nm = String(p.ad || p.name || '').trim();
  if (!nm) return null;
  return { ...p3(), id:uid(), name:nm.slice(0, 80), roomId:rid, catId:cid,
    status:'ihtiyac', priority:mfPrio(p.oncelik || p.priority), acq:null, tags:[], links:[], alts:[],
    brand:String(p.marka || p.brand || '').slice(0, 40), model:'',
    notes:String(p.not || p.note || p.notes || '').slice(0, 300),
    listPrice:null, price:null, card:'', store:'', acqDate:null, instCount:null, instStart:null,
    order:ord, createdAt:t, updatedAt:t };
}

/* boş cihaz: sıfırdan kur (yalnızca kurulum ekranından çağrılır) */
function buildFromManifest(m){
  const t = now(), st = freshState();
  st.meta.welcomed = true; st.meta.setupDone = true;
  const h = m.hedef || m.target || {};
  if (h.baslik || h.title) st.settings.title = String(h.baslik || h.title).slice(0, 60);
  if (/^\d{4}-\d{2}-\d{2}$/.test(h.tarih || h.date || '')) st.settings.date = h.tarih || h.date;
  st.settings.updatedAt = t;
  const rooms = mfRooms(m);
  if (!Array.isArray(rooms) || !rooms.length) throw new Error('Listede oda bulunamadı.');
  let n = 0;
  rooms.forEach((r, ri) => {
    const rn = String(r.ad || r.name || '').trim(); if (!rn) return;
    const rid = uid();
    st.rooms.push({ id:rid, name:rn.slice(0, 40),
      color: ROOM_COLORS.includes(r.renk || r.color) ? (r.renk || r.color) : ROOM_COLORS[ri % ROOM_COLORS.length],
      icon: RICON_KEYS.includes(r.ikon || r.icon) ? (r.ikon || r.icon) : guessRoomIcon(rn),
      order: st.rooms.length, updatedAt: t });
    mfCats(r).forEach(c => {
      const cn = String(c.ad || c.name || '').trim(); if (!cn) return;
      const cid = uid();
      st.cats.push({ id:cid, roomId:rid, name:cn.slice(0, 40), order:st.cats.length, updatedAt:t });
      mfProds(c).forEach(u => {
        const p = newProduct(u, rid, cid, t, st.products.filter(x => x.catId === cid).length);
        if (p){ st.products.push(p); n++; }
      });
    });
  });
  if (!n) throw new Error('Listede ürün bulunamadı.');
  return st;
}

/* mevcut envanter: SADECE EKLER — hiçbir şeyi silmez, hiçbir şeyin üstüne yazmaz */
function mergeManifest(m){
  const t = now(); const rooms = mfRooms(m);
  if (!Array.isArray(rooms) || !rooms.length) throw new Error('Listede oda bulunamadı.');
  const res = { rooms:0, cats:0, prods:0, dup:0 };
  rooms.forEach(r => {
    const rn = String(r.ad || r.name || '').trim(); if (!rn) return;
    let room = roomsA().find(x => trLow(x.name) === trLow(rn));
    if (!room){
      room = { id:uid(), name:rn.slice(0, 40),
        color: ROOM_COLORS.includes(r.renk || r.color) ? (r.renk || r.color) : ROOM_COLORS[roomsA().length % ROOM_COLORS.length],
        icon: RICON_KEYS.includes(r.ikon || r.icon) ? (r.ikon || r.icon) : guessRoomIcon(rn),
        order: roomsA().length, updatedAt: t };
      S.rooms.push(room); res.rooms++;
    }
    mfCats(r).forEach(c => {
      const cn = String(c.ad || c.name || '').trim(); if (!cn) return;
      let ct = catsA(room.id).find(x => trLow(x.name) === trLow(cn));
      if (!ct){
        ct = { id:uid(), roomId:room.id, name:cn.slice(0, 40), order:catsA(room.id).length, updatedAt:t };
        S.cats.push(ct); res.cats++;
      }
      mfProds(c).forEach(u => {
        const nm = String((typeof u === 'string' ? u : (u?.ad || u?.name || '')) || '').trim();
        if (!nm) return;
        if (roomProds(room.id).some(x => trLow(x.name) === trLow(nm))){ res.dup++; return; }   /* aynı odada varsa dokunma */
        const p = newProduct(u, room.id, ct.id, t, catProds(ct.id).length);
        if (p){ S.products.push(p); res.prods++; }
      });
    });
  });
  if (!res.rooms && !res.cats && !res.prods) throw new Error('Eklenecek yeni bir şey yok — hepsi listende mevcut.');
  save();
  return res;
}

/* QR Model 2 · byte mode · ECC-L · v1–10 · harici bağımlılık yok */
const QR = (() => {
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  const TOTAL   = [26,44,70,100,134,172,196,242,292,346];
  const ECCPB   = [7,10,15,20,26,18,20,24,30,18];
  const BLOCKS  = [1,1,1,1,1,2,2,2,2,4];
  const ALIGN   = [[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];

  function rsGen(n){ let g = [1];
    for (let i = 0; i < n; i++){ const ng = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++){ ng[j] ^= g[j]; ng[j+1] ^= mul(g[j], EXP[i]); }
      g = ng; }
    return g; }
  function rsEnc(data, n){ const g = rsGen(n), res = new Array(n).fill(0);
    for (const b of data){ const f = b ^ res[0]; res.shift(); res.push(0);
      if (f) for (let i = 0; i < n; i++) res[i] ^= mul(g[i+1], f); }
    return res; }

  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = -1;
    for (let v = 1; v <= 10; v++){
      const cap = TOTAL[v-1] - ECCPB[v-1] * BLOCKS[v-1];
      const cci = v < 10 ? 8 : 16;
      if (bytes.length + 2 + Math.ceil(cci/8) <= cap){ ver = v; break; }
    }
    if (ver < 0) throw new Error('veri çok uzun');
    const size = 17 + ver * 4;
    const nBlocks = BLOCKS[ver-1], eccPB = ECCPB[ver-1];
    const dataCW = TOTAL[ver-1] - eccPB * nBlocks;
    const cci = ver < 10 ? 8 : 16;

    /* bit akışı */
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    push(4, 4); push(bytes.length, cci);
    bytes.forEach(b => push(b, 8));
    const cap = dataCW * 8;
    for (let i = 0; i < 4 && bits.length < cap; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    const cw = [];
    for (let i = 0; i < bits.length; i += 8){ let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i+j]; cw.push(v); }
    const PAD = [0xEC, 0x11];
    for (let i = 0; cw.length < dataCW; i++) cw.push(PAD[i % 2]);

    /* blokla + ECC */
    const base = Math.floor(dataCW / nBlocks), extra = dataCW % nBlocks;
    const dBlocks = [], eBlocks = [];
    let off = 0;
    for (let i = 0; i < nBlocks; i++){
      const len = base + (i >= nBlocks - extra ? 1 : 0);
      const d = cw.slice(off, off + len); off += len;
      dBlocks.push(d); eBlocks.push(rsEnc(d, eccPB));
    }
    const out = [];
    const maxD = Math.max(...dBlocks.map(b => b.length));
    for (let i = 0; i < maxD; i++) dBlocks.forEach(b => { if (i < b.length) out.push(b[i]); });
    for (let i = 0; i < eccPB; i++) eBlocks.forEach(b => out.push(b[i]));

    /* matris */
    const m = Array.from({length:size}, () => new Array(size).fill(null));
    const set = (r, c, v) => { if (r >= 0 && r < size && c >= 0 && c < size) m[r][c] = v; };
    const finder = (r, c) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++){
      const rr = r+i, cc = c+j; if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
      const on = (i >= 0 && i <= 6 && (j === 0 || j === 6)) || (j >= 0 && j <= 6 && (i === 0 || i === 6)) || (i >= 2 && i <= 4 && j >= 2 && j <= 4);
      set(rr, cc, on ? 1 : 0); } };
    finder(0, 0); finder(0, size-7); finder(size-7, 0);
    const al = ALIGN[ver-1];
    al.forEach(r => al.forEach(c => {
      if ((r <= 8 && c <= 8) || (r <= 8 && c >= size-9) || (r >= size-9 && c <= 8)) return;
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++)
        set(r+i, c+j, (Math.abs(i) === 2 || Math.abs(j) === 2 || (i === 0 && j === 0)) ? 1 : 0); }));
    for (let i = 8; i < size - 8; i++){ set(6, i, i % 2 === 0 ? 1 : 0); set(i, 6, i % 2 === 0 ? 1 : 0); }
    set(size - 8, 8, 1);
    for (let i = 0; i <= 8; i++){ if (m[8][i] === null) set(8, i, 0); if (m[i][8] === null) set(i, 8, 0); }
    for (let i = 0; i < 8; i++){ if (m[8][size-1-i] === null) set(8, size-1-i, 0); if (m[size-1-i][8] === null) set(size-1-i, 8, 0); }

    if (ver >= 7){ for (let i = 0; i < 18; i++){
      const r = Math.floor(i/3), c = size - 11 + (i % 3);
      if (m[r][c] === null) m[r][c] = 0; if (m[c][r] === null) m[c][r] = 0; } }

    /* veri yerleşimi + maske 0 */
    let bi = 0, up = true;
    const dataBits = [];
    out.forEach(b => { for (let i = 7; i >= 0; i--) dataBits.push((b >> i) & 1); });
    for (let col = size - 1; col > 0; col -= 2){
      if (col === 6) col--;
      for (let k = 0; k < size; k++){
        const row = up ? size - 1 - k : k;
        for (let c = 0; c < 2; c++){
          const cc = col - c;
          if (m[row][cc] !== null) continue;
          let v = bi < dataBits.length ? dataBits[bi++] : 0;
          if ((row + cc) % 2 === 0) v ^= 1;            /* maske 0 */
          m[row][cc] = v;
        }
      }
      up = !up;
    }

    /* format bilgisi: ECC-L (01) + maske 000 */
    let fmt = (0b01 << 3) | 0;
    let rem = fmt;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >> 9) & 1) * 0x537);
    const fbits = ((fmt << 10) | rem) ^ 0x5412;
    /* ISO: bit 14 en anlamlı. Kopya 1 */
    const FP1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    for (let i = 0; i < 15; i++){ const [r, c] = FP1[i]; m[r][c] = (fbits >> (14 - i)) & 1; }
    /* Kopya 2: bit 14..8 → sol sütun alttan yukarı, bit 7..0 → üst satır soldan sağa */
    for (let i = 0; i < 7; i++) m[size-1-i][8] = (fbits >> (14 - i)) & 1;
    for (let j = 0; j < 8; j++) m[8][size-8+j] = (fbits >> (7 - j)) & 1;

    /* sürüm bilgisi (v>=7) */
    if (ver >= 7){
      let r2 = ver;
      for (let i = 0; i < 12; i++) r2 = (r2 << 1) ^ (((r2 >> 11) & 1) * 0x1f25);
      const vb = (ver << 12) | r2;
      for (let i = 0; i < 18; i++){ const b = (vb >> i) & 1;
        m[Math.floor(i/3)][size-11+(i%3)] = b; m[size-11+(i%3)][Math.floor(i/3)] = b; }
    }
    return m;
  }
  const svg = (text, px) => {
    const m = encode(text), n = m.length, q = 4, tot = n + q*2, sc = (px || 160) / tot;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) d += `M${(c+q)*sc} ${(r+q)*sc}h${sc}v${sc}h-${sc}z`;
    return `<svg viewBox="0 0 ${px||160} ${px||160}" width="${px||160}" height="${px||160}" shape-rendering="crispEdges">
      <rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  };
  return { encode, svg };
})();

function depAutoLabel(d){
  if (d.kind === 'product')     return (prod(d.refId)?.name || 'ürün') + ' tamamlanınca';
  if (d.kind === 'measurement') return (meas(d.refId)?.label || 'ölçü') + ' alınınca';
  if (d.kind === 'listing')     return (listing(d.refId)?.title || 'ev') + ' seçilince';
  if (d.kind === 'milestone')   return msDef(d.refId).label + ' kazanılınca';
  return 'koşul';
}
/* döngü kontrolü: a, b'ye bağlanırsa döngü oluşur mu? */
function wouldCycle(fromId, toId, seen){
  if (fromId === toId) return true;
  seen = seen || new Set();
  if (seen.has(toId)) return false;
  seen.add(toId);
  const t = prod(toId); if (!t) return false;
  return (t.deps || []).some(d => d.kind === 'product' && wouldCycle(fromId, d.refId, seen));
}
function depSheet(p, done){
  let kind = 'product';
  const KL = { product:'Başka ürün', measurement:'Ölçü', listing:'Ev seçimi', milestone:'Dönüm noktası', manual:'Serbest koşul' };
  const rec = openSheet(`
    ${sheetHead('Bağımlılık ekle', esc(p.name))}
    <div class="sh-b">
      <div class="fld"><label>Ne bekliyor?</label><div class="pill-row" id="dp-k"></div></div>
      <div id="dp-body"></div>
      <div class="fld"><label>Etiket · isteğe bağlı</label><input class="inp" id="dp-l" placeholder="Kendi cümlenle yaz"></div>
      <button class="btn" id="dp-ok">Ekle</button>
    </div>`);
  let refId = null;
  const paintBody = () => {
    const b = $('#dp-body', rec.sh);
    if (kind === 'product'){
      const opts = prodsA().filter(x => x.id !== p.id && !wouldCycle(p.id, x.id));
      b.innerHTML = `<div class="fld"><label>Hangi ürün</label>
        <select class="inp" id="dp-ref"><option value="">Seç…</option>${opts.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`;
    } else if (kind === 'measurement'){
      const ms = measA();
      b.innerHTML = ms.length ? `<div class="fld"><label>Hangi ölçü</label>
        <select class="inp" id="dp-ref"><option value="">Seç…</option>${ms.map(m => `<option value="${m.id}">${esc(m.label || m.type)}</option>`).join('')}</select></div>`
        : `<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:12px">Henüz ölçü yok. Ev Arama → seçilen ev → Ölçüler’den ekleyebilirsin.</div>`;
    } else if (kind === 'listing'){
      const ls = listA();
      b.innerHTML = ls.length ? `<div class="fld"><label>Hangi ev</label>
        <select class="inp" id="dp-ref"><option value="">Seç…</option>${ls.map(l => `<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select></div>`
        : `<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:12px">Henüz ilan yok.</div>`;
    } else if (kind === 'milestone'){
      b.innerHTML = `<div class="fld"><label>Hangi dönüm noktası</label>
        <select class="inp" id="dp-ref"><option value="">Seç…</option>${MS_DEFS.map(d => `<option value="${d.id}">${d.label} · ${d.tr}</option>`).join('')}</select></div>`;
    } else {
      b.innerHTML = `<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:12px">Serbest koşulu elle tamamlandı işaretlersin.</div>`;
    }
  };
  const paint = () => { $('#dp-k', rec.sh).innerHTML = DEP_KIND.map(k =>
    `<button class="pill ${k===kind?'on':''}" data-dk="${k}">${KL[k]}</button>`).join(''); paintBody(); };
  paint();
  rec.sh.addEventListener('click', e => { const b = e.target.closest('[data-dk]'); if (b){ kind = b.dataset.dk; refId = null; paint(); } });
  $('#dp-ok', rec.sh).addEventListener('click', () => {
    const sel = $('#dp-ref', rec.sh);
    refId = sel ? sel.value : null;
    const label = $('#dp-l', rec.sh).value.trim();
    if (kind !== 'manual' && !refId){ toast('Önce bir seçim yap'); return; }
    if (kind === 'manual' && !label){ toast('Koşulu yaz'); return; }
    if (kind === 'product' && wouldCycle(p.id, refId)){ toast('Bu bağ döngü oluşturur'); return; }
    const d = { id: pid('dp'), kind, refId: refId || null, label: label.slice(0,100), done:false, note:'' };
    d.label = d.label || depAutoLabel(d);
    (p.deps ??= []).push(d); touch(p); save(); closeSheet(rec); done && done();
  });
}

function capItem(p){
  const o = { i:p.id, n:p.name, s:p.status, r:p.roomId, c:p.catId };
  if (p.acq) o.a = p.acq;
  if (p.brand) o.b = p.brand;
  if (p.model) o.m = p.model;
  if (p.priority) o.pr = p.priority;
  if (p.phaseId) o.ph = p.phaseId;
  if (p.essential) o.e = 1;
  if ((p.ecosystemIds||[]).length) o.ec = [...p.ecosystemIds];
  if (p.price != null) o.pz = p.price;
  const sel = (p.alts||[]).find(a => a.st === 'selected'); if (sel) o.sel = sel.name;
  const rej = (p.alts||[]).filter(a => a.st === 'rejected').map(a => a.name); if (rej.length) o.rej = rej;
  const fav = (p.alts||[]).find(a => a.st === 'favorite'); if (fav) o.fav = fav.name;
  return o;
}
function makeCapsule(name, auto){
  const f = finance(), rm = readyMetric(), dm = dreamMetric();
  const cap = { id: pid('tc'), name: name || 'Kapsül', at: now(), era: ERA(),
    metrics: { readyPct: rm.empty ? null : rm.pct, dreamPct: dm.pct, doneCount: dm.done, total: dm.total,
      pocket: Math.round(f.pocket), market: Math.round(f.market), saved: Math.round(f.saved), debt: Math.round(f.debt) },
    items: prodsA().map(capItem),
    ups: upsA().map(u => ({ i:u.id, p:u.productId, t:u.targetName, s:u.status })),
    auto: !!auto, updatedAt: now() };
  (S.capsules ??= []).push(cap);
  logEvent('capsule_created', 'capsule', cap.id, `Kapsül: ${cap.name}`, {});
  save();
  return cap;
}

function capsuleCompare(){
  const caps = (S.capsules || []).filter(alive).sort((a,b) => b.at - a.at);
  if (caps.length < 2) return;
  let a = caps[1].id, b = caps[0].id;
  const rec = openSheet(`${sheetHead('Kapsül karşılaştır', 'İki an arasında ne değişti')}<div class="sh-b" id="cc"></div>`);
  const paint = () => {
    const A = caps.find(x => x.id === a), B = caps.find(x => x.id === b);
    const mapA = new Map(A.items.map(i => [i.i, i])), mapB = new Map(B.items.map(i => [i.i, i]));
    const added = B.items.filter(i => !mapA.has(i.i));
    const removed = A.items.filter(i => !mapB.has(i.i));
    const doneNow = B.items.filter(i => i.s === 'tamam' && mapA.get(i.i) && mapA.get(i.i).s !== 'tamam');
    const prefCh = B.items.filter(i => { const o = mapA.get(i.i); return o && ((o.b||'') !== (i.b||'') || (o.sel||'') !== (i.sel||'') || (o.fav||'') !== (i.fav||'')); });
    const phCh = B.items.filter(i => { const o = mapA.get(i.i); return o && (o.ph||'') !== (i.ph||''); });
    const rejCh = B.items.filter(i => { const o = mapA.get(i.i); return o && (i.rej||[]).length > (o.rej||[]).length; });
    const sec = (t, list, fmt) => list.length ? `<div class="sub-h" style="margin-top:14px">${t} · ${list.length}</div>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">${list.slice(0, 10).map(fmt).join('<br>')}</div>` : '';
    $('#cc', rec.sh).innerHTML = `
      <div class="two" style="margin-bottom:14px">
        <select class="inp" id="cc-a">${caps.map(c => `<option value="${c.id}" ${c.id===a?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
        <select class="inp" id="cc-b">${caps.map(c => `<option value="${c.id}" ${c.id===b?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="ovgrid">
        <div class="stat"><div class="lb">Tamamlanma</div><div class="v serif" style="font-size:19px">%${A.metrics.dreamPct} → %${B.metrics.dreamPct}</div>
          <div class="sub">${B.metrics.dreamPct - A.metrics.dreamPct >= 0 ? '+' : ''}${B.metrics.dreamPct - A.metrics.dreamPct} puan</div></div>
        <div class="stat"><div class="lb">Cepten çıkan</div><div class="v serif" style="font-size:19px">${fmtMoney(B.metrics.pocket - A.metrics.pocket)}</div><div class="sub">bu aralıkta</div></div>
      </div>
      ${sec('Tamamlananlar', doneNow, i => `✦ ${esc(i.n)}`)}
      ${sec('Yeni ürünler', added, i => `+ ${esc(i.n)}`)}
      ${sec('Kaldırılanlar', removed, i => `− ${esc(i.n)}`)}
      ${sec('Değişen tercihler', prefCh, i => { const o = mapA.get(i.i);
        return `${esc(i.n)}: ${esc(o.sel || o.fav || o.b || '—')} → ${esc(i.sel || i.fav || i.b || '—')}`; })}
      ${sec('Faz değişenler', phCh, i => { const o = mapA.get(i.i);
        return `${esc(i.n)}: ${esc(phase(o.ph)?.name || 'atanmamış')} → ${esc(phase(i.ph)?.name || 'atanmamış')}`; })}
      ${sec('Yeni elenen alternatifler', rejCh, i => `${esc(i.n)} · ${(i.rej||[]).slice(-2).map(esc).join(', ')}`)}`;
    $('#cc-a', rec.sh).addEventListener('change', e => { a = e.target.value; paint(); });
    $('#cc-b', rec.sh).addEventListener('change', e => { b = e.target.value; paint(); });
  };
  paint();
}

const GF_DEF = { brand:true, model:true, link:true, note:false };
const shareF = g => ({ ...GF_DEF, ...(g.shareFields || {}) });
function giftText(g){
  const sf = shareF(g);
  const lines = [g.name, g.note ? g.note : '', ''].filter(x => x !== null);
  g.productIds.map(i => prod(i)).filter(p => p && alive(p)).forEach(p => {
    const bits = [p.name];
    if (sf.brand && p.brand) bits.push(p.brand);
    if (sf.model && p.model) bits.push(p.model);
    let line = '• ' + bits.join(' · ');
    if (sf.note && p.notes) line += '\n  ' + p.notes.slice(0, 120);
    if (sf.link && p.links && p.links.length) line += '\n  ' + p.links[0].url;
    lines.push(line);
  });
  return lines.filter(x => x !== '').join('\n');
}
function giftShare(id){
  const g = giftsA().find(x => x.id === id); if (!g) return;
  const sfh = shareF(g);
  const txt = giftText(g);
  const rec = openSheet(`
    ${sheetHead('Paylaş', esc(g.name))}
    <div class="sh-b">
      <pre class="onb-pre" style="max-height:220px">${esc(txt)}</pre>
      <button class="btn" id="gs-copy">Metni kopyala</button>
      ${navigator.share ? `<button class="btn ghost" id="gs-share" style="margin-top:10px">${I.right} Paylaş</button>` : ''}
      <button class="btn ghost" id="gs-print" style="margin-top:10px">Yazdır / PDF</button>
    </div>`);
  $('#gs-copy', rec.sh).addEventListener('click', () => {
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => toast('Kopyalandı ' + sparkTxt), () => toast('Kopyalanamadı'));
    else toast('Metni elle seçip kopyala');
  });
  $('#gs-share', rec.sh)?.addEventListener('click', () => {
    navigator.share({ title: g.name, text: txt }).catch(() => {});
  });
  $('#gs-print', rec.sh).addEventListener('click', () => {
    const w = open('', '_blank'); if (!w){ toast('Pencere engellendi'); return; }
    const items = g.productIds.map(i => prod(i)).filter(p => p && alive(p));
    w.document.write(`<!doctype html><meta charset=utf-8><title>${esc(g.name)}</title>
      <style>body{font-family:Georgia,serif;max-width:620px;margin:40px auto;padding:0 24px;line-height:1.6}
      h1{font-size:28px;margin-bottom:4px}p.n{color:#666;margin-top:0}
      li{margin-bottom:10px}.b{color:#555;font-size:14px}a{color:#3F4DBA}</style>
      <h1>${esc(g.name)}</h1>${g.note?`<p class=n>${esc(g.note)}</p>`:''}
      <ul>${items.map(p => { const bits=[];
        if(sfh.brand&&p.brand)bits.push(esc(p.brand));
        if(sfh.model&&p.model)bits.push(esc(p.model));
        return `<li><b>${esc(p.name)}</b>${bits.length?` <span class=b>· ${bits.join(' · ')}</span>`:''}
        ${sfh.note&&p.notes?`<div class=b>${esc(p.notes)}</div>`:''}
        ${sfh.link&&p.links&&p.links.length?`<div><a href="${esc(p.links[0].url)}">${esc(p.links[0].url.slice(0,60))}</a></div>`:''}</li>`; }).join('')}</ul>
      <script>onload=()=>{print()}<\/script>`);
    w.document.close();
  });
}

function importSheet(data){
  const n = { p: data.products.filter(x => !x.deleted).length, r: data.rooms.filter(x => !x.deleted).length };
  const rec = openSheet(`
    ${sheetHead('Yedeği geri yükle', `${n.r} oda · ${n.p} ürün`)}
    <div class="sh-b">
      <p style="font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:16px">
        <b>Birleştir:</b> her kayıt için en son düzenlenen kazanır, hiçbir şey silinmez.<br>
        <b>Birebir geri yükle:</b> bu cihazdaki veri tamamen yedektekiyle değiştirilir.</p>
      <div class="two">
        <button class="btn ghost" id="imp-merge">Birleştir</button>
        <button class="btn" id="imp-replace">Birebir geri yükle</button>
      </div>
    </div>`);
  $('#imp-merge', rec.sh).addEventListener('click', () => {
    const errs = validateBackup(data);
    if (errs.length){ toast('Dosya bozuk: ' + errs[0]); return; }
    const r = Sync.mergeRemote(data);
    repairRefs(S);
    persistNow(); applyTheme(); render(); closeSheet(rec);
    toast(r.changedLocal ? 'Yedek birleştirildi ' + sparkTxt : 'Yedek zaten güncel');
  });
  $('#imp-replace', rec.sh).addEventListener('click', () => {
    const errs = validateBackup(data);
    if (errs.length){ toast('Dosya bozuk: ' + errs[0]); return; }   /* mevcut veriye DOKUNULMAZ */
    const keepCid = S.settings.clientId;
    data.tagBank = Array.isArray(data.tagBank) ? data.tagBank : [];
    data.cats = Array.isArray(data.cats) ? data.cats : [];
    data.meta = { installedAt: now(), deviceId: uid(), ...(data.meta || {}), welcomed: true };
    data.settings = { title:'Şehre Dönüş', date:'2028-02-01', currency:'₺', theme:'system', clientId:'', ...(data.settings || {}) };
    if (!data.settings.clientId) data.settings.clientId = keepCid;
    data.lastSync = 0;
    S = migrate(data); repairRefs(S);
    persistNow(); applyTheme(); render(); closeSheet(rec);
    toast('Yedek birebir geri yüklendi ' + sparkTxt);
  });
}

function toggleTick(el, e){
  const p = prod(el.dataset.tick); if (!p) return;
  if (isDone(p)) setStatus(p, p.prevStatus && p.prevStatus !== 'tamam' ? p.prevStatus : 'ihtiyac');
  else setStatus(p, 'tamam', e);
}
